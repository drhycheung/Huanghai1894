<script>
const CHAPTERS = [{"title": "楔子：海面上，一支烟柱指向分岔", "html": "<p>公元1894年9月17日，农历八月十八，午时刚过。</p>\n<p>黄海上空没有云，太阳白晃晃地悬在当顶，把海面晒成一片亮得睁不开眼的铅灰。没有风。船尾的烟囱拖着笔直的黑烟，在静止的空气中凝成一根根立柱，从远到近，排成一列——那是十二艘铁壳的活物，正朝着同一个方向，缓缓地碾过来。</p>\n<p>甲板上的水兵最先望见东南海平线上的烟柱。起初是一缕，然后是两缕、三缕，黑色的烟柱像香案上的香，一排立起来，又渐渐连成一线。有人眯着眼睛数了半天，忽然转身就跑，边跑边喊。北洋水师的甲板上于是活了过来：测距的，填弹的，升旗的，擦炮的，铁甲上的脚步声像冰雹砸在锅盖上。军令从定远舰上扯着嗓子喊出去，靠着旗语和灯光一条船一条船地递，递到最后，已经变了调。</p>\n<p>旗舰定远在最前。它太大了，大得像一座浮在海上的城。六寸厚的克虏伯钢甲包住两舷，两门三十公分口径的主炮仰向天空，粗黑的炮身在日头底下投下两道长长的影子。炮手们伸手去摸刚填进炮膛的弹，冰凉。旁边有人踢了他一脚：&quot;轻些。这一发，是三百万两银子。&quot;</p>\n<p>没有人笑。</p>\n<p>日本舰队已经横过来了。吉野、松岛、严岛、桥立、高千穗、秋津洲、浪速——清一色的新舰，清一色的快舰，像一群被精心喂养的狼，在远处拉开一条长阵，然后整整齐齐地转身，用侧舷对着这边。那是教科书上的阵型，是他们在军港里练过一万遍的把式。而北洋水师此刻排出的，是老祖宗传下来的雁行阵——两翼张开，中央突出，像一只展翅欲飞的大雁。</p>\n<p>雁，是飞不惯海的。</p>\n<p>午后十二点五十分，定远舰上升起龙旗。开火。</p>\n<p>那一声响，天和地都颠了一下。三十公分的炮弹从炮膛里飞出去，在海面上撕开一道白痕，落进海里，掀起一根冲天水柱。紧接着，镇远、来远、经远、致远，各舰的炮一齐响了。浓烟在舰队中间腾起来，很快连成一片，把太阳吞了进去。黄海上第一次有了雾——不是水汽，是硝烟。</p>\n<p>致远舰在阵形的最左翼。舰长邓世昌站在飞桥上，手背上的青筋鼓着，像老树的根。他身后站着帮带大副陈金揆——三十岁出头，广东香山籍，留美幼童出身，会说三国洋文，此刻用一种近乎冷静的眼神看着远处的敌阵。</p>\n<p>&quot;他们要包我们。&quot;陈金揆说。</p>\n<p>邓世昌没有回头：&quot;我知道。&quot;</p>\n<p>雁行阵在实战里撑不过两轮。中央的定远、镇远死死顶住，两翼的弱舰却被日军的高航速撕开缺口。超勇起火，扬威起火，经远的烟囱被打断，来远全舰烧成一团火球却还在向前。致远身边的水兵一个接一个倒下去，甲板上的血顺着排水沟淌，混进海水里，转眼没了颜色。</p>\n<p>北洋的炮，从开战那一刻起，就在以肉眼可见的速度变少。定远、镇远那四门三十公分的克虏伯主炮，炮膛粗得像城门洞，可膛里能用的炮弹，掰着手指头数得过来。弹药兵一趟趟往底舱跑，又一趟趟空着手上来——七年前买的那批旧弹，引信大多受潮，打出去的不是偏，就是哑。管带们心知肚明，谁也不肯声张，只把勉强能用的好弹，一颗一颗，悄悄匀给定远、镇远两艘铁甲舰。对面，吉野、松岛、高千穗的炮声密得像雨点，清一色的新舰，清一色的快舰，弹药满舱。</p>\n<p>下午三点左右，致远舰已被弹数十发，船体倾斜，机舱进水。邓世昌从飞桥上下来，走到陈金揆面前，看着这个跟自己学了十年海战的年轻人。</p>\n<p>&quot;金揆，&quot;他说，&quot;冲过去，撞它。&quot;</p>\n<p>陈金揆明白他说的是什么。致远还有最后一千吨的排水量，还有最后一点机动力，而吉野就在前方不到四海里处——那条整个东亚最快的巡洋舰，正在用炮火一点点把这个国家的海军剥成碎片。</p>\n<p>&quot;撞完呢？&quot;陈金揆问。</p>\n<p>邓世昌想了想，说：&quot;撞完就撞完。&quot;</p>\n<p>陈金揆没有立正。他只是把帽子正了正，转身去传令。机舱里的人听见了，没有一个说话，只是把汽门开到最大。锅炉轰隆隆地喘起来，像一头困兽最后的吼声。致远舰就这样拖着倾斜的身体，从浓烟里冲了出去，直直地朝着吉野的舷侧扑过去。海面上炸开一片惊呼，日舰开始调转舵轮，北洋各舰的水兵扒着舷墙看着那道斜插而出的身影，谁都忘了躲炮。</p>\n<p>距离三海里。两海里。一海里——吉野的舵终于转了过来，庞大的舰体开始侧身规避。就在两船即将相错的一瞬，致远舰的舵机突然发出一声金属的嘶叫，整个船头猛地一沉——舵轴断了。</p>\n<p>舰体直直地插进海里，像一柄被折断的剑。海水从破口里涌进来，锅炉炸了，蒸汽混着浪花冲天而起。陈金揆觉得耳朵里&quot;嗡&quot;地一下，然后什么声音都没有了。他看见邓世昌站在舰桥残骸上，朝自己的方向说了句什么，被风吹散。然后整艘船在他脚下裂开，他坠进冰凉的水里。</p>\n<p>没有人顾得上捞他。海面上的天平，此刻已经彻底倾了——日舰的阵形正从两侧包抄过来，准备收割这片再没有还手之力的海面。超勇烧成空壳，扬威断成两截，来远、经远歪在海里，浑身是洞。北洋能站着的铁舰，只剩下定远、镇远两艘，还死死横在日舰包抄的中央。</p>\n<p>就在这一刻，定远、镇远两艘铁甲舰的炮膛里，各被塞进了最后一发能用的炮弹。</p>\n<p>不是克虏伯新造的，是七年前那批存货里最后挑出来的两发。弹药兵把弹推进膛时，手在抖——所有人都知道，这两发打出去，两艘铁舰上就再没有能打的炮弹了。可他们也明白，不把它们打出去，这两艘铁舰，就要在沉默里被一艘一艘地凿沉。</p>\n<p>定远先开了一炮。三十公分的炮弹穿过硝烟，不偏不倚，砸进吉野号的中部。吉野是日军最快的巡洋舰，仗着航速冲在最前，从没挨过这样的重击——弹药库的方向腾起一团橘红的火，整条舰猛地一斜。</p>\n<p>海面上静了一瞬。日军所有望远镜都转向吉野。</p>\n<p>紧接着，镇远又补了一炮。那是两艘铁甲舰上最后一发炮弹，划着一条几乎看不见的弧线，再一次，命中吉野。吉野的舰艏炸开，燃着的碎木铁片抛向半空，又落进海里，嘶嘶地冒白烟。</p>\n<p>日军的阵形，忽然停住了。</p>\n<p>站在松岛舰桥上的指挥官，手里的望远镜一直没放下来。他数了数自己舰上的炮弹——已经不多了。他又看了看那两艘还横在海上的铁甲舰，看了看吉野舰艏那团还没灭的火。</p>\n<p>北洋还有炮弹。北洋的炮还打得这么准。他一整个下午推算的&quot;北洋弹药将尽&quot;，看来是错了。</p>\n<p>他不知道，那是两发。两发打出去以后，那两艘铁甲舰的炮膛，就空了。</p>\n<p>陈金揆再醒来时，已经是傍晚。他趴在一块船板的碎片上，浑身是血。致远在他身后不远处沉没，只剩一个桅尖还露在水面上，像竖着的一根手指，指着天。他拼着力气转过头去看海面——到处是残骸，到处是火光，漂浮的木头、军帽，还有一动不动的人。而远处，日舰的阵形已经散开了，正在缓缓向东退去，吉野拖着浓烟，踉跄着走在阵列的最前面。</p>\n<p>日本的舰队退了。</p>\n<p>他们确实是退了。松岛的主炮一直没找到北洋的破绽，比睿、赤城在混战里掉了队，燃着两团明火。可真正让他们下定决心的，是那两发命中了吉野的炮弹——吉野是日本海军的脸面，是这条阵线上冲得最快的刀，连它都被打成了这样，那北洋的炮弹库里，还存着多少这样的东西？加上太阳正往西坠，日本海军建军以来从不打夜战，谁也不知道天黑以后，那两艘铁甲舰会不会再打出几发这样的炮弹来。</p>\n<p>他们赌不起。于是他们退走了。</p>\n<p>这一退，退了很久都没有人敢回头。</p>\n<p>如果换成任何一场仗，这一退都是怯懦。可只有身在黄海的人知道，这一退，并不轻松——他们不是输给了哪个人，是输给了两发刚好落在吉野身上的炮弹。而那个真正弹尽粮绝的人，此刻正趴在船板上，看着那支舰队远去。</p>\n<p>天黑之前，一艘中国渔船把陈金揆捞了上来。他躺在船板上，看着满天的星子，一口一口咳出血水。船老大蹲在他旁边，看着他身上那身北洋水师的军装，看了很久，忽然问：&quot;大帅，咱们……赢了吗？&quot;</p>\n<p>陈金揆张了张嘴，没说话。他想起邓世昌最后对他说的那句话，想起致远倾覆前那一瞬海水灌进机舱的声音。他终于点了点头。他说：&quot;赢了。&quot;</p>\n<p>这句话，将在一个月内传遍整个大清，从京师到两广，从紫禁城到每个县城的茶馆。人们会说这是天朝上国应得的胜利，会说是列祖列宗显灵，会说是洋枪洋炮也不过如此。朝廷会拨款犒赏，皇太后会下懿旨，举国会狂欢。</p>\n<p>没有人知道，这一仗他们差点输光了一个海军。</p>\n<p>没有人知道，真正让他们&quot;赢&quot;的，不是他们自己，而是两发恰好命中的炮弹——是北洋炮膛里最后的两发，打出去以后，他们就再也没有了。</p>\n<p>没有人知道，致远舰底舱里那一箱箱写着&quot;克虏伯&quot;字样的炮弹，是七年前买的；而船坞里，那块本该用来再造一艘定远的银子，早变成了颐和园里的一根汉白玉石柱。就在致远沉没的同一时刻，北京城的工部档案里，最新一笔海军拨款，记的仍是&quot;奉懿旨，修园&quot;。</p>\n<p>三年前，公元1891年，北洋水师第二次访问日本。横滨港上，日本水兵仰着头看定远那四门巨炮，看得脸色发白。可甲板上晾着的水兵衣物、炮管上没人擦拭的锈迹，也被他们看了个清清楚楚。日本人记下了这一切。回国的路上，明治天皇从内库里掏出三十万日元——那是他自己的私房钱——一道敕谕，全国文武官员减薪一成，充作造舰费。此后六年，日本每年如此。</p>\n<p>而清政府，自公元1891年起，两年之内不再购买外洋枪炮舰只。户部的理由是：已然天下第一，何必再费银两。</p>\n<p>龟兔赛跑。兔子睡着了。</p>\n<p>还有一个细节，史书里很少人提起。同治十一年（公元1872年），第一批留美幼童登船赴美；两年后，第三批里有个十四岁的孩子，名叫陈金揆。这些幼童中，有人叫詹天佑，后来修了京张铁路；有人叫唐绍仪，后来办起了总理衙门的交涉，一路做到大臣；还有很多人，随北洋舰队沉进了黄海。他们学回来的铁路、电报、水雷、测绘，朝廷用得着，却从来不许他们碰权力——哪怕是军火库里该买什么炮弹、该造多大的军舰，也轮不到他们说半个字。他们能做的，只有站在飞桥上，用自己的命去填制度的窟窿。</p>\n<p>而就在陈金揆趴在渔船板上的这一刻，千里之外的伦敦，格林威治皇家海军学院的课堂上，仍坐着几个日本学员。日本海军从二十年前建校起，年年向这里输送军官——他们学成回国，进海军省，进军令部，造舰，购炮，编军制，定国策，二十年间，从未间断。</p>\n<p>中国的西学人才，却连一支炮弹的采购权都碰不到。</p>\n<p>海面上，致远的桅尖还露在水上，像一根竖着的、沉默的手指。</p>\n<p>指向这个国家的虚假盛世。</p>"}, {"title": "第1章：九十九盏琉璃宫灯下的算盘", "html": "<p>光绪二十年（公元1894年）十月初十，北京城落了一场薄雪。</p>\n<p>紫禁城的号角从黎明吹到日中，把整座皇城吹得像一口烧开的锅。今天是圣母皇太后六十万寿，又兼海疆大捷，两个喜事叠在一处，朝廷没有理由不把这场庆典办得比康乾年间更铺张。太和殿前搭起三丈高的彩楼，九十九盏琉璃宫灯在冷风里晃，像一树熟透的柿子。</p>\n<p>容闳是头一天夜里到的北京。</p>\n<p>他从天津下船，走水路进京，沿途每座城的城门都挂着红绸，每间茶馆都在说黄海大捷。船夫把桨划得飞快，嘴里唱新编的得胜小调，唱到&quot;定远一声吼，倭贼丢魂走&quot;处，满船人都跟着拍手。容闳没有拍手。他靠在船舷上，看着河面上自己那张被岁月磨暗了的脸，觉得这一路的水，都比来时重了。</p>\n<p>他六十六岁了。前一年他还在美国，在华盛顿把他筹划多年的国家银行章程最后润色，想给这个千疮百孔的国家找一条新钱的路子。战事一起，他坐立不安，上书李鸿章，主张拿海关税作抵押，向英美银行借款，购舰购炮，从根上重建一支能打仗的水师。信寄出去，回音迟迟不来。等他终于等到朝廷答复，电报上只有四个字：大捷。速归。</p>\n<p>他对着那封电报，在异国的旅馆里坐了一整夜。他没有高兴。他太清楚&quot;大捷&quot;两个字的分量——它要用性命去填，用银子去烧，用一代人的血泪去换。他更清楚，朝廷把这封电报拍给他，等于宣告海战已经结束；而一旦认定结束，就不会再有人愿意为海防多花一分钱。他在美国亲眼见过那是怎样的国家：打了败仗要整顿，打了胜仗更要扩张。可这个国家……他放下电报，收拾行李。他得回去看看，这顿&quot;大捷&quot;的宴席上，坐着的究竟是一群什么样的人。</p>\n<p>万寿庆典在午门外开宴。</p>\n<p>容闳被安排在文官席的末座——他顶着二品衔，资格老，却没有实差，所以座位排得远。可他坐得远，看得清。隔着几百桌的杯盏声、吆喝声、丝竹声，他看见高台上的那几把椅子，一张一张，把这座王朝最聪明的几个头脑都摆在了明处。</p>\n<p>最上头是慈禧太后。她端坐在九龙靠背椅上，穿一身明黄寿字袍，笑得极开。底下百官三跪九叩，山呼万寿无疆，她把手虚抬了抬，让太监撒下一把一把的赏银。容闳看见她的眼神——那眼神扫过满殿辉煌时，在某一瞬忽然收紧了。那是数钱的眼光。容闳心里一凛：他在海关干了这些年，太认得这种眼光了。这顿宴席花了多少，来年的海防还能剩多少，这位老太太心里，有一本比他更精的账。</p>\n<p>太后身边坐着皇帝。光绪皇帝今年二十有三，瘦，白，坐在龙椅上像一杆插进花瓶里的青竹。他也在笑，笑着举杯，笑着向太后敬酒，笑着听大臣念贺表——可容闳一直盯着他，发现这位年轻皇帝笑的时候，眼睛始终没有弯。他的目光越过满殿的喧嚣，落在宫墙上，落在那根垂下来的、绣着龙的锦帷上，仿佛在数那上面一共绣了几条龙，又仿佛在数——这宫里，究竟还剩下几条龙肯听他的。</p>\n<p>容闳忽然明白了一件事：坐在这座城最高处的两个人，一个在数钱，一个在数龙。他们庆祝的，根本不是同一场胜利。</p>\n<p>李鸿章坐在太后下首第一席。他今年七十一了，脸颊的肉垂下来，眼袋沉得像两只装满水的布袋，可那双眼睛还亮着——那是整个北洋最后的亮光。百官敬酒，他喝；贺表念到&quot;再造河山&quot;，他笑；太后夸他&quot;老成谋国&quot;，他磕头谢恩，磕得比别人都重。容闳看得仔细：这位中堂大人磕头的时候，腰背先是一僵，随即才缓缓弯下去。那是受过伤的腰，也是被无数奏折、战报、洋人的照会压弯的腰。宴席过半，李鸿章借口更衣离席。容闳注意到他走路的步子比来时慢了半拍，而且绕开了那排燃得正旺的宫灯——仿佛怕光。</p>\n<p>容闳知道自己这位老上司在想什么。他太了解李鸿章了：这个人一辈子把国家背在背上，也把淮系、把门生、把家产、把半生的声名捆在同一根绳上。他赢下了这场仗，却比谁都清楚这仗赢得有多悬——那批用了七年的炮弹，那艘没造出来的定远，那被挪去修园的银子，全在他心里。他此刻最怕的，不是倭寇再来，而是这满殿的歌舞升平让天下人都信了&quot;天朝上国&quot;四个字，从此再没有人肯陪他补那艘船、换那门炮。那样，他这辈子就白背了。他想起前些年他力主再订两艘铁甲舰，奏章递上去，银子却像水渗进沙里——一半渗进了颐和园的湖底，一半被&quot;天下第一、何必再买&quot;八个字挡了回来。定远、镇远还撑得住，可舰队已经三年没添过一条新船了。</p>\n<p>宴席散后，容闳在偏殿遇见袁世凯。</p>\n<p>袁世凯是刚卸了朝鲜的差事回京的，五品的顶戴，借了李鸿章的门路进京贺寿。他端着酒杯挨桌敬酒，敬到谁跟前都是双手捧杯、腰弯得恰到好处，说的话也恰到好处——既不谄媚得招人厌，又亲热得让人记在心里。容闳站在廊下看了他半晌，心里忽然浮起一层凉意。他见过太多这样的年轻人了，可这个不一样。这个人的眼里没有一丝谄媚，他敬酒的时候，眼睛在笑，可那笑意底下，是一架正在上弦的弓。</p>\n<p>&quot;容大人。&quot;袁世凯不知何时走到了他身边，递过一杯酒，&quot;晚辈久仰。当年您送幼童出洋的事，晚辈一直记着。&quot;</p>\n<p>容闳接过酒，没有喝：&quot;袁大人在朝鲜辛苦了。&quot;</p>\n<p>&quot;不敢说辛苦。&quot;袁世凯笑了笑，&quot;中堂大人常说，练兵千日，用兵一时。晚辈不过是想把那一时，攒得长一些。&quot;</p>\n<p>他说完便走了，脚步轻快，像一阵没有目的的晚风。容闳看着他的背影，心里浮起一句话：这世上的聪明人，从来都是先把自己准备好，再等别人给他理由。</p>\n<p>第二日，容闳把李鸿章没有看完的两份奏折残稿翻了出来——一份是湖广总督张之洞的，一份是两江总督刘坤一的，都在请朝廷趁胜整顿、续办洋务。张之洞的字写得极好，一笔一画，像刻在石头上的碑文，句句不离&quot;自强&quot;&quot;工艺&quot;&quot;学堂&quot;&quot;立宪&quot;，句句都在替天下的读书人和工匠请命；可容闳读了三遍，读出那字缝里藏着一句话：这座天下，该由我张之洞来立规矩。刘坤一的奏折则通篇在讲&quot;保境安民&quot;，讲东南财赋之地不可再乱，讲练新军、固江防——字字都在替国家打算盘，可那盘算的里子，是东南半壁，是他刘坤一的半壁。</p>\n<p>容闳把两份奏折轻轻合上，搁回桌上。</p>\n<p>六十六岁的人了，他在灯下坐了半宿。窗外紫禁城的灯火已经熄了大半，只剩太和殿的琉璃在月色里泛着冷光。他明白自己为什么非要赶回来——他不是回来赴这场宴的。他是回来看看，这个国家在最得意的时候，还有没有几个人记得它最虚弱的时候。</p>\n<p>有。只是没有一个人，是单纯为了这个国家。</p>\n<p>他想起那四个字：大捷，速归。</p>\n<p>那场大捷，救了一个国家的面子，也埋了一个国家的根。</p>\n<p>那顿盛宴，庆祝了一场胜利，也庆祝了一场沉睡的开始。</p>\n<p>他翻开案头那本翻旧了的名册，上面记着他当年送去美国的那些孩子的名字——詹天佑、唐绍仪、蔡廷幹、陈金揆……他得把他们找回来。这场胜利不能就这样让谁都看不见真相；总得有人，把这件盛世的衣裳，扯开一角。</p>"}, {"title": "第2章：一本发黄的名册", "html": "<p>光绪二十一年（公元1895年）春，容闳把那本翻旧了的名册摊在天津寓所的桌上。</p>\n<p>窗外是海河，三月的风裹着咸腥味灌进来，吹得纸页哗哗作响。名册是光绪元年（公元1875年）他亲手订的，上面一笔一画录着一百二十个孩子的名字、籍贯、年庚、所学。纸已经泛黄，墨色却还在——像是二十多年前那些孩子渡海时的眼睛，隔了这么多年，还在看他。</p>\n<p>他先去见的是詹天佑。</p>\n<p>詹天佑在唐山，管着开平矿务局那段铁路。容闳寻到他的时候，他正蹲在路基边，用一把洋铁尺量钢轨的接缝，满手的油泥，裤腿上溅着泥点。看见容闳，他把尺子往口袋里一塞，直起身，咧嘴笑了笑：&quot;先生。&quot;</p>\n<p>容闳看着他的脸。三十四五岁的人，头发里已经有了白丝，眉骨上有一道旧疤——那是当年在美留学时，学校宿舍失火，他背同学下楼划的。容闳记得清清楚楚。</p>\n<p>&quot;听说你在修铁路。&quot;容闳说。</p>\n<p>&quot;嗯。&quot;詹天佑回头看了一眼那道一直伸向远处的铁轨，&quot;修了几年了。煤运得出去，就什么都好说。&quot;</p>\n<p>容闳没有接话。他看了一会儿詹天佑身边那摞图纸，忽然问：&quot;朝廷让修的？&quot;</p>\n<p>詹天佑沉默了一下，把图纸卷起来：&quot;是洋人签的合同，中堂大人过问过。修路是修路，用谁修的，不是咱们说了算。&quot;</p>\n<p>他顿了顿，又说：&quot;先生，您送我们出洋的时候，说的是学回来报国。我修这条铁路，不知道算不算报国。&quot;</p>\n<p>容闳没有立刻回答。他想起二十年前在船上，那个十二岁的孩子站在船舷边，望着渐渐远去的码头，忽然回过头来问他：&quot;先生，美国有多大？&quot;</p>\n<p>&quot;很大。&quot;当时他说，&quot;大到，够装下很多东西。&quot;</p>\n<p>&quot;那中国装得下吗？&quot;</p>\n<p>他没有回答那个问题。现在他依然回答不了。</p>\n<p>第二日，容闳在天津见到了唐绍仪。</p>\n<p>唐绍仪在天津的洋务局当差，职衔是译员，兼着几分文案的差事。他穿一身笔挺的洋式常服，领口扣得一丝不苟，说话时中英文夹杂，快得像连珠炮。容闳见到他的时候，他正替一位英国公使的随员翻译一句关于关税的函件，译完放下笔，抬头看见容闳，立刻站起来，深深一揖。</p>\n<p>&quot;先生，&quot;他说，&quot;您怎么来了。&quot;</p>\n<p>容闳看着这个当年在旧金山码头用三个铜板买下第一份英文报纸的少年，如今已经能在一群洋人中间谈笑自若。他心里一阵高兴，又一阵说不出的凉。</p>\n<p>&quot;绍仪，&quot;容闳问，&quot;你在洋务局，可还做得顺？&quot;</p>\n<p>唐绍仪的笑容收了一下。他看了看左右，压低声音：&quot;先生，洋务局里译员有十几个。译来译去，都是他们定好的话。真正该译给朝廷听的，一句也送不进去。&quot;</p>\n<p>&quot;那你还愿意译？&quot;</p>\n<p>&quot;愿意。&quot;唐绍仪说，&quot;哪怕十句里进不了一句，也得有人站着。&quot;</p>\n<p>容闳看着他。他知道这个年轻人有多聪明——在美国的时候，他能把一部《联邦宪法》从头背到尾，还能用最平白的话讲给同宿舍的福建孩子听。这样的人，本不该只做一个译员。</p>\n<p>&quot;绍仪，&quot;容闳终于说，&quot;我会想办法，让你走到能说话的位置上去。&quot;</p>\n<p>唐绍仪怔了一下，随即笑了。那笑容里有感激，也有一点很淡的、说不清道不明的东西：&quot;先生，您为我们的前程，操了一辈子的心。&quot;</p>\n<p>容闳没有接这句话。他只在心里想：我不只是为了你们的前程。</p>\n<p>三日之后，容闳在威海卫见到了陈金揆。</p>\n<p>陈金揆是坐着一艘破旧的小火轮从刘公岛过来的。他瘦了很多，左臂还吊着绷带，军装洗得发白，肩上却挂着一串勋章——那是朝廷论功行赏发的，黄海大捷的奖章，一枚枚擦得锃亮。</p>\n<p>容闳看见他的第一眼，心里就沉了下去。这个年轻人站着，却好像不是站在陆地上，而是还站在那块漂着的船板上。他的眼睛是亮的，但亮得过分，像是要把什么从眼底烧出来。</p>\n<p>&quot;金揆，&quot;容闳走到他面前，&quot;你瘦了。&quot;</p>\n<p>陈金揆动了动嘴角，算是笑了笑：&quot;先生，致远没了。&quot;</p>\n<p>容闳没有说话。他当然知道。致远沉了，邓世昌没了，超勇扬威经远广甲都没了。那一仗，北洋水师沉了五艘船，死了数百名弟兄，到头来只换得四个字——黄海大捷。</p>\n<p>&quot;先生，&quot;陈金揆又说，&quot;朝廷给我发了勋章，让我养伤。可我躺在病床上，每天一闭眼，就是致远沉下去的样子。我听见机舱里的人还在喊，听见邓管带站在飞桥上对我说的最后一句话。&quot;</p>\n<p>&quot;他说了什么？&quot;</p>\n<p>陈金揆沉默了很久，才说：&quot;他说，金揆，撞完就撞完。&quot;</p>\n<p>海风从威海卫的海面上吹过来，带着铁锈和硝烟的气味。容闳看着这个年轻人，忽然想起当年在名册上，陈金揆那一栏写着的字：香山县，幼童第三批，习英文、算学。</p>\n<p>他把这些名字一个一个在心里默念过去，念到最后，眼前浮起的，全是海。</p>\n<p>容闳回到寓所，重新把名册摊开。他数了一下，一百二十个名字里，如今还在国内、还在当差的，不到一半。其余的人，有的死了，有的散了，有的漂在海外，再也不肯回来。</p>\n<p>他对着这本名册坐了很久。</p>\n<p>他想起自己当年做这件事的初衷。咸丰四年（公元1854年），他从耶鲁毕业，站在美国的土地上，看着这个年轻的共和国一寸一寸地强壮起来，心里忽然冒出一个念头——中国要是也能这样，就好了。他把这个念头压了近二十年，直到同治十一年（公元1872年），终于说动朝廷，送出了第一批幼童。</p>\n<p>他当时以为，只要把一批又一批的年轻人送出去，让他们学会这世界上最好的东西，再带回来，这个国家就会一寸一寸地好起来。</p>\n<p>他错了。</p>\n<p>他送出去的是种子，可这个国家，是一块石头。</p>\n<p>种子在石头缝里发了芽，长出了根，根却扎不进去——不是种子不好，是石头不肯让。</p>\n<p>他把名册合上，抬起头，看着窗外。海河的水正混着早春的冰碴缓缓向东流，像这个国家一样，看似在动，实则不知要流向哪里。</p>\n<p>&quot;总得有人，&quot;他对自己说，&quot;把这块石头撬开一条缝。&quot;</p>\n<p>他提笔，给北京的两位老友各写了一封信。一封给总理衙门的某位堂官，一封给他在美国时结识、如今在朝中说得上话的同僚。信里只有一句话：</p>\n<p>&quot;容闳乞见圣颜，有关于国运之策，伏乞代奏。&quot;</p>\n<p>信寄出去的第三天，他收到了回音。</p>\n<p>不是他所求见的皇帝，而是李鸿章的中堂府送来的一纸请柬，邀他明日至北洋大臣衙门一叙，说是有&quot;国家大事，与先生相商&quot;。</p>\n<p>容闳把请柬搁下，看着窗外的海河，笑了。</p>\n<p>他知道，那块石头，自己开口了。</p>"}, {"title": "第3章：储材馆里的一席之地", "html": "<p>李鸿章在中堂府召见容闳那日，恰逢朝廷钦差的御史也在座。</p>\n<p>容闳进门时，那位御史正端着茶盏，用眼角打量着院子里新从洋行买来的照相机、留声机之类的东西，脸上挂着那种见过世面的、不屑的神情。容闳在廊下站了一刻，等着传唤。他听见帘子后面有说话声，断断续续地飘出来——</p>\n<p>&quot;……既已大捷，洋务自当乘胜而进。区区器物，不过外夷之余技……&quot;</p>\n<p>&quot;老夫不瞒大人，&quot;李鸿章的声音不紧不慢，像老茶壶里倒出来的水，&quot;若无这些&#x27;外夷之余技&#x27;，黄海上沉的就该是老夫的旗舰了。&quot;</p>\n<p>御史不说话了。容闳在廊下微微点头：李鸿章这个人，永远知道什么时候该把话说透，什么时候该把话咽回去。</p>\n<p>他被引进花厅时，那御史已经告辞了。李鸿章坐在主位上，穿一件半旧的青绸袍子，手里握着那杆用了二十多年的水烟袋。他抬起头，看见容闳，目光里先是一暖，随即又恢复成那副惯常的、疲沓的从容。</p>\n<p>&quot;纯甫，&quot;他唤容闳的字，&quot;坐。茶凉了，换一盏。&quot;</p>\n<p>容闳坐下。他注意到，这间花厅的陈设极简——没有多余的瓷器字画，墙上只挂着一幅自书的对联，字是行书，笔意却沉：&quot;受尽天下百官气，养就胸中一段春。&quot;落款是&quot;少荃自警&quot;。</p>\n<p>容闳看了一会儿那幅字，说：&quot;中堂，这联子写得真好。&quot;</p>\n<p>李鸿章顺着他的目光看了一眼，笑了笑，没接话。过了半晌，他把水烟袋搁下，忽然换了一个调子：&quot;纯甫，我问你一句话。你留美幼童一百二十人，如今学成归来，可还有几个，真正想做事的？&quot;</p>\n<p>&quot;大半。&quot;容闳说。</p>\n<p>&quot;可朝廷用他们的，是十中无一。&quot;李鸿章叹了口气，用指节敲了敲桌面，&quot;老夫今日叫你来，不为别的，就为这个。户部报上来的海防条陈，通篇是添购军火、整顿舰政——可里头没一个字，提这些洋学生能做什么。&quot;</p>\n<p>容闳心里一动。他等着。</p>\n<p>&quot;老夫想走一步险棋。&quot;李鸿章抬起头，看着他，一字一句地说，&quot;老夫要请朝廷，设立一个&#x27;洋务储材馆&#x27;，凡幼童出洋学成者，一体入馆，量才叙用。此事，老夫递折子，你替老夫把章程拟出来。&quot;</p>\n<p>容闳的心跳了一下。他知道这是什么——这是李鸿章打算用一道奏折，把二十年前那些种子，从石头缝里一棵一棵地拽出来，栽到朝廷看得见的地方。</p>\n<p>但他也明白，这道奏折一旦递上去，全朝的守旧派都会跳起来。</p>\n<p>&quot;中堂，&quot;容闳斟酌着字句，&quot;储材馆一事，恐怕言官们不会答应。&quot;</p>\n<p>&quot;所以老夫才要你来拟章程。&quot;李鸿章说着，忽然笑了一下，笑容里带着点说不出的疲倦，&quot;纯甫，你以为老夫不知道那些言官会说什么？他们只会说：&#x27;洋学生何德何能，敢与进士同列？&#x27;——可老夫要的，不是他们答应。老夫要的，是他们来不及反对。&quot;</p>\n<p>他顿了顿，又说：&quot;黄海一仗，朝廷欠洋务一个天大的人情。这个情分，用一分，少一分。老夫要趁着它还在，把能办的事，都办了。&quot;</p>\n<p>容闳看着他。他明白了，李鸿章今天找他来，不只是为了一道奏折——他是要在那些守旧派还没醒过神来的时候，把幼童这步棋，彻底落下去。</p>\n<p>&quot;中堂高见。&quot;容闳说，&quot;章程，我拟。&quot;</p>\n<p>他拟了三天。</p>\n<p>三天里，他把储材馆的条规一条条铺开：凡留洋学生入馆，分门考核，量才录用；授以职衔，与同品文官同俸；馆中设藏书楼、讲习所，聘洋教习教授新学；三年一考，优者升叙，劣者罢黜。</p>\n<p>他写得极细，连馆舍的规制、用度的定额都一一列明。写完最后一字，他搁下笔，看着窗外渐暗的天色，想起当年在船上，那些孩子踮着脚，望着大洋的方向，眼睛亮得发光。</p>\n<p>那时候他以为，只要种子进了土，就能发芽。</p>\n<p>如今他明白，让种子能扎下根的那层土，是李鸿章用一张黄海大捷的人情，一寸一寸替他换回来的。</p>\n<p>奏折递上去半个月后，朝议如李鸿章所料地炸了。</p>\n<p>言官们联名上折，说&quot;洋学生入仕，是坏祖宗成法&quot;，说&quot;储材馆直是开洋人入我朝堂之先例&quot;，说得最狠的一篇，直接用了&quot;冠履倒置&quot;四个字。折子雪片一般飞进宫里，闹得沸沸扬扬。</p>\n<p>然后，李鸿章递上了第二道奏折。</p>\n<p>这道奏折只有寥寥数行。李鸿章在折子里说：臣闻黄海一役，倭舰之速，快于臣舰；倭炮之利，利于臣炮。臣舰之上，掌炮者、司舵者、测距者，半为幼童出洋学成之士。是役之胜，赖此辈血战而致。今四海升平，朝廷酬功酬勋，独不能酬此辈一席之地乎？</p>\n<p>这道折子递上去，朝堂上忽然安静了。</p>\n<p>没有人能驳斥他的话——因为他说的是事实。黄海上那些真正操作着仪器、校正着弹道、让北洋水师的炮打得准的人，正是那些&quot;冠履倒置&quot;的洋学生。</p>\n<p>御笔朱批下来，只有四个字：准如所请。</p>\n<p>储材馆开馆那天，正是初夏。容闳站在馆门前，看着几十个穿着崭新的官服、却还带着一身油墨和铁锈气息的年轻人鱼贯而入，心里忽然涌起一阵酸热。</p>\n<p>他认出其中许多人。那些在唐山蹲在路基边量轨的，那些在洋务局替人翻译的，那些躺在病床上望着天花板的——他们如今都站在这道门槛内了。</p>\n<p>他想起李鸿章在奏折里写的那句话：&quot;酬功酬勋，独不能酬此辈一席之地乎？&quot;</p>\n<p>容闳想通了：李鸿章帮他办成这件事，不是为了他容闳，也不是完全为了这些孩子。他是要在朝堂上立起一个&quot;洋务&quot;的招牌，立起一块他李中堂能够合法地、源源不断地把洋务人才塞进朝廷的台阶。</p>\n<p>他帮的是他的洋务，他的淮系，他的&quot;裱糊&quot;。</p>\n<p>可容闳站在门口，看着那些年轻人一个个走进去，在心里对自己说：</p>\n<p>&quot;不管他为的是谁，这扇门，终究是开了。&quot;</p>\n<p>门开了，种子就进来了。</p>\n<p>种子进来了，石头缝里，就有了光。</p>\n<p>他抬头看了看天。初夏的日头明晃晃地照着，把他身后那道门槛的影子，拉得很长，很长。</p>"}, {"title": "第4章：五人一桌，各怀心事", "html": "<p>光绪二十一年（公元1895年）秋，朝议开海防会议。</p>\n<p>说是海防会议，其实议的早不止海防——北洋水师黄海一役虽胜，沉了五艘，伤了元气；东南海疆，法夷、英夷、俄夷的兵舰在通商口岸游弋如家常便饭；而陆上，新练的洋操军在各直省星星点点地冒出来。朝廷上下都隐隐觉得，该有一件大事，把这些零零碎碎的洋务，拢成一股劲。</p>\n<p>于是，皇帝下诏，召直隶总督李鸿章、湖广总督张之洞、两江总督刘坤一，以及北洋、南洋、福建诸水师统领，会同军机处，集议于乾清门外的朝房。</p>\n<p>容闳作为&quot;洋务储材馆&quot;的创办人，得了列席的资格。他坐在最末一排，隔着重重人影，看那一干身着补服、头戴翎顶的朝廷大员，分坐两厢。</p>\n<p>这是他第一次，亲眼看见那几个人坐在同一间屋子里。</p>\n<p>张之洞最先开口。</p>\n<p>这位湖广总督今年五十八岁，身材魁梧，声音洪亮，一开口便是长篇大论，引经据典，从《周礼》讲到《海国图志》，句句不离&quot;自强&quot;二字。他说铁路当造，工厂当设，学堂当兴，谓&quot;今日之势，中国非学西方之器，不能存于列国之间&quot;；又说&quot;然学其器，先学其制，制之不善，器亦徒然&quot;。</p>\n<p>他讲完，满座皆默。有人点头，有人低头喝茶，有人交换了一个眼神。</p>\n<p>容闳在末席听得明白：张之洞这篇议论，漂亮，周详，无懈可击——可从头到尾，他说的都是&quot;我张之洞要做什么&quot;，没说&quot;朝廷该出多少银子&quot;。</p>\n<p>李鸿章接了他的话。北洋大臣不紧不慢，先说张之洞&quot;香涛所言，切实可行&quot;，夸得滴水不漏；然后话锋一转，说到海防经费：&quot;然则方今库款支绌，户部岁入不过数千万，而海防、江防、陆防，处处要钱。为今之计，惟先其所急。&quot;</p>\n<p>他顿了顿，目光扫过全场：&quot;老夫以为，黄海一役，倭患暂息。然海防之不可废，犹故也。欲强海军，必先固造船之基；欲固造船之基，必先兴钢铁、机器之业。此二层，老夫已与南洋、湖广两处商议，拟合办一&#x27;实业总厂&#x27;，以官商合力，造机器、炼钢轨、造兵舰之铁料……&quot;</p>\n<p>他说到这里，故意停了一下，去看张之洞的反应。</p>\n<p>张之洞的眉头几不可察地动了一下。他早就听闻，李鸿章想把手伸进湖广、东南的地盘，合办实业——所谓&quot;官商合力&quot;，官，是直隶的官；商，是淮系的商；合出来的厂，姓李还是姓张，他心里比谁都清楚。</p>\n<p>&quot;中堂所言极是。&quot;张之洞开口，脸上挂着笑容，语气却硬了几分，&quot;然实业之兴，贵在因地制宜。楚地铁煤之利，素冠天下；若由武昌设局，就近开采炼造，事半功倍。此事，下官已在汉阳筹办，不敢劳中堂远虑。&quot;</p>\n<p>他说&quot;不敢劳&quot;，声音不高，却像一根钉子，轻轻敲进了桌沿。</p>\n<p>李鸿章捻着胡须，笑了笑，不置可否。</p>\n<p>容闳在末席看得手心冒汗。他看明白了，这场会，与其说是议海防，不如说是两个人在地图上画圈——你画你的武昌，我画我的北洋，谁也不肯让谁。</p>\n<p>刘坤一一直没有说话。</p>\n<p>这位两江总督坐在张之洞下首，身材瘦小，面目清癯，像一尊枯坐的老僧。他一直在喝茶，偶尔抬眼看一看堂上挂的钟，仿佛这场争论与他无关。</p>\n<p>直到李鸿章与张之洞各自把话说了个来回，他才缓缓放下茶盏，开口了。</p>\n<p>&quot;诸位大人，&quot;刘坤一的声音不高，却字字清楚，&quot;海防之议，老夫听过了。铁路之议，老夫也听过了。老夫只问一句：若东南有事，诸位大人谁肯出师相援？&quot;</p>\n<p>满座忽然静了。</p>\n<p>刘坤一的目光缓缓扫过全场，说：&quot;老夫坐镇两江，守的是东南财赋之区。此地商旅辐辏，洋人云集，稍有动荡，便是弥天大祸。老夫以为，练兵、设厂、兴学，固不可缓；然必先保东南之安，而后能言其他。&quot;</p>\n<p>他这番话说得冠冕堂皇，容闳却听得心里雪亮。刘坤一的话，翻译过来只有一句：你们要改革，可以；但别动我的地盘，别让我的东南出事。你们怎么折腾北方，那是你们的事；我刘坤一，守我的两江。</p>\n<p>&quot;坤一公所言，实为老成之见。&quot;一个年轻的声音忽然响起。</p>\n<p>容闳顺着声音看去，只见末席一位身着新式军服的将领站了起来。那人约莫三十六七岁上下，面目清俊，站姿笔挺，行止间带着一股北洋新军独有的、利落的气质。他朝堂上几位大员拱了拱手，说：</p>\n<p>&quot;晚辈袁世凯，忝列北洋练兵差使。诸位大人所议，皆国家百年大计。晚辈愚见：今日中国之弊，在兵之不精、器之不新。练兵、造械，实为当务之急。晚辈愿以所练新军为试验，若朝廷允准，先将淮、直之兵汰旧改新，练成一旅精锐，以观成效。&quot;</p>\n<p>他说得谦逊，容闳却看见他眼里一闪而过的光。那不是谦虚的光，是一匹狼看见猎物的光。</p>\n<p>李鸿章皱了一下眉。袁世凯是他一手提拔起来的，他练兵，本在李中堂的算盘里。但今日这话从袁世凯嘴里说出来，怎么听，都有点越俎代庖的味道。</p>\n<p>张之洞看了袁世凯一眼，没有接话。他素来瞧不起这种&quot;武弁出身、靠钻营上位的后生&quot;。</p>\n<p>刘坤一却眯起了眼睛。他盯着袁世凯看了很久，忽然笑了一下：&quot;袁统领少年英气，可喜可贺。只是练兵一事，动辄百万之费。老夫倒想请教：练这一旅新军，经费从何而出？&quot;</p>\n<p>袁世凯一怔，随即笑道：&quot;户部之款，朝廷自有安排。&quot;</p>\n<p>&quot;户部之款，如今连海防都不够用。&quot;刘坤一慢悠悠地说，&quot;袁统领，若是老夫记得不错，去年北洋请练新军，拨的款项，是借的洋款罢？&quot;</p>\n<p>这话一出，满座又是一静。</p>\n<p>李鸿章的脸色，几不可察地沉了一下。</p>\n<p>容闳坐在末席，看着这一屋子的人，终于明白了什么。他明白了这场会议的真相——没有人在这间屋子里真正为&quot;中国该往何处去&quot;争论。他们争论的，是银子往哪里流，是权柄往哪里落，是谁该在上面，谁该在下面。</p>\n<p>张之洞要的是名，是清名，是&quot;我张之洞开创了中国之实业&quot;的千秋功业；</p>\n<p>李鸿章要的是实，是淮系那盘下了几十年的棋，不因黄海一仗的惨胜而崩盘；</p>\n<p>刘坤一要的是稳，是他那东南半壁的太平，是谁也别动他的两江；</p>\n<p>袁世凯要的是势，是趁朝廷要练兵、要新式陆军的当口，把自己从一介武弁，磨成一把谁都得用的刀。</p>\n<p>而那位坐在深宫里的皇帝，要的是权。</p>\n<p>容闳把这场会议从头看到尾，只觉得一阵说不出的疲惫。他也明白了，自己这些年所追求的&quot;变法&quot;&quot;自强&quot;，在这些人心目中的分量，也许远没有他自己想象得那么重。</p>\n<p>可他也明白另一件事。</p>\n<p>这几个人，各自盘算着各自的利益，却在这间屋子里，共同说出了一句相同的话：中国，必须变。</p>\n<p>没有人把这句话说全，但每个人话里的字缝里，都藏着这两个字。</p>\n<p>容闳在心里把这两个字，反复嚼了几遍。他忽然觉得，这或许就是这个国家的救赎之路——不是靠某一个人的圣明，而是靠这一群各怀鬼胎的聪明人，各自为了自己的利益，被逼着，走向同一个方向。</p>\n<p>会议结束时，张之洞最先离席，昂首阔步；刘坤一慢悠悠地踱步出去；袁世凯向众人拱手，快步离去；李鸿章最后一个起身，经过容闳身边时，停了一下，低声说了一句：</p>\n<p>&quot;纯甫，你看见了。&quot;</p>\n<p>容闳点点头，没有说话。</p>\n<p>他看见了。他看见了一潭暗流——不是清流，不是浊流，是几个人各自拼命搅动自己那一块水，搅出来的，漩涡。</p>\n<p>可他也看见了，那漩涡的中心，指向的，恰好是这个国家该去的方向。</p>\n<p>这大概就是天意，或者是，这个国家残存的那点运气。</p>"}, {"title": "第5章：冬夜的密室同盟", "html": "<p>光绪二十一年（公元1895年）冬，天津，北洋大臣衙门后院的密室。</p>\n<p>这间屋子极小，四面无窗，只头顶一方天窗漏下一点天光。屋中央一张八仙桌，桌上没有茶，只有几盏煤油灯，火光在冷风里一窜一窜，把几张脸照得明灭不定。</p>\n<p>容闳是跟着李鸿章进来的。他以为只有他一人，推门才发现，张之洞、刘坤一、袁世凯竟都已坐在桌前。三个人见了容闳，目光都微微一凝——显然，李鸿章没有告诉他们，今晚还有第四个人要来。</p>\n<p>&quot;诸位，&quot;李鸿章在主位上坐下，声音不高，却压得很沉，&quot;老夫今夜请诸位来，不议国事。只议一事：这个国，我们几个人，打算怎么救。&quot;</p>\n<p>这话说得坦荡，屋里的气氛却陡地一紧。</p>\n<p>张之洞先开口，声音带着冷笑：&quot;中堂说笑了。救国之策，明发上谕，廷议共商便是，何必如此鬼鬼祟祟？&quot;</p>\n<p>&quot;香涛，&quot;李鸿章看着他，缓缓说，&quot;你我都清楚，若是明发上谕、廷议共商，此事便办不成。&quot;</p>\n<p>&quot;为何？&quot;</p>\n<p>&quot;因为廷议上坐着的，除了你我，还有那些翰林、言官、御史。&quot;李鸿章说，&quot;他们不懂什么叫铁甲舰，不懂什么叫铁路，不懂什么叫生铁钢轨。他们只知道一件事：凡是有利于他们自己清名的事，他们就赞成；凡是让他们担风险的事，他们就反对。朝廷想办的每一件实事，都死在他们手里。&quot;</p>\n<p>张之洞沉默了。</p>\n<p>&quot;老夫今日请诸位来，&quot;李鸿章接着说，&quot;是想把一件大事，摊开在桌面上说。这件事，若成，则诸位的实业、练兵、洋务、新政，从此都有个名分，朝廷立个规矩，大家按规矩办事；若不成，则朝中守旧势大，诸位今日所有，明日都可能化为乌有。&quot;</p>\n<p>&quot;中堂说的是立宪？&quot;刘坤一忽然开口。</p>\n<p>李鸿章看了他一眼，缓缓点头。</p>\n<p>屋里安静了片刻。然后，张之洞长长吐出一口气，说：&quot;立宪之事，香涛早有此意。然朝廷之柄，握于太后。宪政若行，则皇权旁落，太后岂能容？&quot;</p>\n<p>&quot;这就是老夫要请诸位来的原因。&quot;李鸿章说，&quot;若要立宪，必须先让皇帝拿到权，让太后不得不退。而要让太后退，需要朝中有足够的力量，逼她松手。&quot;</p>\n<p>他的目光缓缓扫过三人：&quot;老夫一人的力量，不够。香涛的湖广，不够；坤一的两江，不够。可若是诸位合力，京中有皇帝，直隶有老夫，湖广有香涛，两江有坤一，再加上新练的洋操军……&quot;</p>\n<p>他说到这里，刻意停住了。</p>\n<p>袁世凯抬起头，目光与李鸿章相接。他当然听懂了——中堂的话里，那一支新练的洋操军，指的正是他的新军。</p>\n<p>&quot;中堂，&quot;袁世凯缓缓开口，&quot;晚辈一介武夫，不敢妄议朝政。只是晚辈有一事不解：立宪，于国家何益？&quot;</p>\n<p>&quot;于国家，&quot;李鸿章说，&quot;可救你我一族，免于灭顶之灾。&quot;</p>\n<p>&quot;何解？&quot;</p>\n<p>&quot;今日之天下，&quot;李鸿章说，&quot;是满人的天下。可满人不会练兵，不会开矿，不会造机器。能练兵的，是汉人；能开矿的，是汉人；能造机器的，是汉人。今日之局，汉人有钱、有兵、有才，却无分毫权柄。满人有权、有势，却无才、无兵。若长此以往，要么汉人造反，要么满人亡国，要么两败俱伤。而立宪，是唯一一条路——把天下人的权，分给天下人；把天下人的力，聚成一股绳。满人保住一个虚名，汉人拿到实权。大家都活。&quot;</p>\n<p>他这番话说完，屋里静得只剩油灯的火苗声。</p>\n<p>容闳坐在角落，听着这一番话，只觉得背后一阵阵发凉。</p>\n<p>他看清了，李鸿章今夜把这些人叫来，不是要谈什么救国大义。他是在做一笔生意——用&quot;立宪&quot;这个名头，把张之洞的湖广、刘坤一的两江、袁世凯的新军，全部绑上他李中堂的战车。名义上是&quot;救中国&quot;，实际上，是给他自己的洋务、淮系，加一道护身符。</p>\n<p>他望向张之洞。张之洞的脸色阴晴不定，显然也在权衡：答应李鸿章，便等于把自己的清名，赌在这艘船上；不答应，则湖广一隅之力，绝难独自推动立宪。</p>\n<p>他又望向刘坤一。这位两江总督低着头，指尖轻轻叩着桌面，像在算一笔账：两江财赋，能否在变法中保全？东南之安，是否因立宪而得更稳？</p>\n<p>最后，他望向袁世凯。袁世凯的眼睛亮得惊人——那是一个猎人看见猎物落入圈套时的光。他显然已经盘算清楚：立宪若成，他袁世凯的新军，便是朝廷倚仗的唯一新式武力；届时，他就不再是李鸿章门下一个小小的练军统领，而是可以与中堂平起平坐的、新朝廷的柱石。</p>\n<p>容闳心底升起一阵寒意。</p>\n<p>他看见了这个同盟的底色：没有一个人是为了&quot;救中国&quot;而来的。他们是为了自己的利益，各自打算，然后被李鸿章用一个&quot;立宪&quot;的名头，拢到了一张桌前。</p>\n<p>可他知道，这个同盟，恰恰是这个千疮百孔的国家，眼下唯一的希望。</p>\n<p>&quot;老夫有一句话，&quot;李鸿章见众人都沉默，缓缓开口，&quot;今日之事，牵一发而动全身。诸位若有异见，今日出门，便可当作没来过。若诸位移步至此，便是默许了老夫的提议。明日，老夫将上一道奏折，请立宪之议。&quot;</p>\n<p>他顿了顿，一字一句地说：&quot;这道折子，只要递上去，就没有回头路了。&quot;</p>\n<p>屋里静了很久。</p>\n<p>张之洞忽然开口：&quot;立宪之议，香涛赞同。但有一事，须先说定：宪政之纲，当以学务、实业为先。此二端，非香涛自夸，楚地已有根基，他日宪政草创，当由楚地先行试办。&quot;</p>\n<p>&quot;自然。&quot;李鸿章说。</p>\n<p>刘坤一开口：&quot;宪政当保地方之权。两江之地，自练其兵，自理财赋，朝廷不得横加干预。&quot;</p>\n<p>&quot;自然。&quot;李鸿章说。</p>\n<p>袁世凯开口：&quot;新军之练，须加大费。他日宪政既行，陆海两军，当以新式为主。晚辈所练之军，望朝廷勿废。&quot;</p>\n<p>&quot;自然。&quot;李鸿章说。</p>\n<p>三句话，三个条件。李鸿章一一应下，神色不变。</p>\n<p>容闳坐在末席，看着这四个人在灯下你来我往，把一场本该是&quot;救国&quot;的大事，谈成了一笔各取所需的买卖。他忽然想起多年前在美国读到的《国富论》里的一句话：各人都只盘算他自己的利益，却在不知不觉间，被一只有看不见的手，引导着去促进一个他毫无所知的、社会的目的。</p>\n<p>那只手，或许就是这个国家残存的运气。</p>\n<p>&quot;纯甫。&quot;李鸿章忽然唤他。</p>\n<p>容闳抬起头。</p>\n<p>&quot;老夫要你替老夫写一道奏折。&quot;李鸿章说，&quot;立宪之议，由老夫出面，名不正言不顺。若是你以&#x27;洋务储材馆&#x27;创办人之身份，联合京师学堂、实业诸同人，联名上折，请求变法，再由老夫、香涛、坤一分别附议，则于朝廷，便是&#x27;民意所趋&#x27;。&quot;</p>\n<p>容闳心里一凛。他明白，李鸿章不仅要把张之洞、刘坤一、袁世凯绑上船，还要把他这个&quot;民间开明士绅&quot;也绑上船——用他的名望，去为这桩买卖背书。</p>\n<p>&quot;中堂，&quot;容闳斟酌着说，&quot;此事若败，容闳死不足惜。只是馆中诸生，皆是朝廷费了心血栽培的人才……&quot;</p>\n<p>&quot;老夫知道。&quot;李鸿章说，&quot;老夫不要他们死。老夫要他们，活着看到新天。&quot;</p>\n<p>屋里的灯焰又窜了一下。</p>\n<p>容闳沉默良久，终于点头：&quot;容闳，愿为诸公执笔。&quot;</p>\n<p>他答应了。</p>\n<p>不是因为相信李鸿章，不是因为他真的信立宪能救中国，而是因为他看见，这间密室里，这四个人——无论他们各自图谋什么——今夜坐在一张桌前，共同做了一件事：答应为这个国家，推一把。</p>\n<p>这一推，或许推不动什么。</p>\n<p>但不推，这个国家，就真的停在原地了。</p>\n<p>散席时，容闳最后一个离开。他走出那间密室，站在冬夜的庭院里，抬头看着满天星斗。北风刮着他的脸，他却觉得胸中有一团火。</p>\n<p>他想起二十年前，那个在船上问&quot;美国有多大&quot;的孩子。</p>\n<p>他轻声说：&quot;孩子，美国够大，装得下很多东西。可中国，也够大——大到，该装得下我们自己。&quot;</p>\n<p>他转身，走回屋里。油灯还亮着，桌上那盏茶的烟，早已凉了。</p>\n<p>风从门缝里灌进来，卷起地上一张写废的纸。纸面上，只残留着一行被涂去的字迹，依稀还能辨出两个字——&quot;请开&quot;。</p>\n<p>没有人注意到它。更没有一个人想到，四个多月后，这张纸，会以另一种方式，从一间牢房里，被递到军机大臣刚毅的案头。</p>"}, {"title": "第6章：一封密信的重量", "html": "<p>光绪二十二年（公元1896年）四月，天津的密盟会议过去四个多月。</p>\n<p>京城的空气忽然变了。</p>\n<p>先是御史言官联名弹劾，说&quot;天津聚众，妄议国是&quot;；接着有军机章京放出风声，说李鸿章私会督抚，勾结洋人，图谋不轨。茶楼里有人悄悄议论，说&quot;李中堂要倒霉了&quot;。再往后，连最迟钝的人也觉出了不对劲——步军统领衙门的捕役，开始在各衙门门口转悠。</p>\n<p>消息传到容闳耳中时，他正在洋务储材馆里，替京师学堂的教员批阅译文。来报信的是储材馆的一名年轻馆员，姓容，叫容星桥——容闳的族侄，第二批留美幼童，回国后入了北洋海军，因识洋文，又兼着储材馆与海军之间传文的差事。</p>\n<p>&quot;叔叔，&quot;容星桥压着声音说，&quot;我刚从军机处门口过，见着刚毅的人了。&quot;</p>\n<p>&quot;刚毅？&quot;容闳的手一停。刚毅是军机大臣，甲午年间的主战派领袖，因这场仗阴差阳错地&quot;胜&quot;了，他在朝中的底气反而更足——仿佛那场胜利是他喊出来的。他素来恨李鸿章，恨洋务，恨一切&quot;师夷长技&quot;的东西。</p>\n<p>&quot;他派人盯着储材馆了。&quot;容星桥说，&quot;还有，我听说，咱们上月联名上的那道请开国会的折子，被人抄了底稿，递到太后面前了。&quot;</p>\n<p>容闳的脸色变了。</p>\n<p>那道折子，正是李鸿章在密盟会议上托他办的&quot;民意所趋&quot;。折子本身不致命——请开国会，虽是违例，却还够不上谋逆。致命的是，折子上联名的那些人，与天津那间密室里的几位，叠在了一起。若有人顺着这条线查下去，密室同盟，便会从&quot;几封奏折&quot;，变成&quot;私结朋党，图谋不轨&quot;。</p>\n<p>&quot;底稿在谁手里？&quot;容闳问。</p>\n<p>&quot;不知道。&quot;容星桥摇头，&quot;我只知道，步军统领衙门今夜要搜储材馆。&quot;</p>\n<p>容闳站在桌前，只觉得一阵眩晕。他活了大半辈子，大风大浪见过不少，可从未像此刻这样，清楚地感觉到一张网正从头顶罩下来。</p>\n<p>&quot;星桥，&quot;他说，&quot;你立刻把咱们柜里那些底稿烧了。联名的，往来的，一个字别留。&quot;</p>\n<p>&quot;那您呢？&quot;</p>\n<p>&quot;我留下。&quot;容闳说，&quot;他们今夜若来搜，总得有人应对。我是储材馆的创办人，我不在，他们搜得更肆无忌惮。&quot;</p>\n<p>容星桥看了他一眼，转身要走，又停住。</p>\n<p>&quot;叔叔，&quot;他说，&quot;那些要递给海军衙门的密信，我不烧。留着。&quot;</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;留着，&quot;容星桥低声说，&quot;就算他们今夜搜出来，也不过是&#x27;私通海军的普通公文&#x27;。可要是烧了，反而显得咱们心虚。&quot;</p>\n<p>容闳想了想，点头：&quot;你说得对。烧掉的，是折子底稿；留下的，是寻常公文。&quot;</p>\n<p>当夜子时，步军统领衙门的捕役破门而入，搜了整整两个时辰。他们翻箱倒柜，抄走了一摞摞文书——其中，就有那几封&quot;寻常公文&quot;。</p>\n<p>领头的武官把一封封信翻来覆去地看，忽然冷笑一声，把其中一封举到灯下：</p>\n<p>&quot;容大人，&quot;他说，&quot;这封署名&#x27;容星桥&#x27;的，是写给谁的？&quot;</p>\n<p>容闳心里一沉。</p>\n<p>&quot;是写给海军衙门的。&quot;他强作镇定，&quot;容星桥是海军军官，与衙门往来文书，寻常事。&quot;</p>\n<p>&quot;寻常事？&quot;武官把那封信凑到他眼前，&quot;可这信里，怎么提到&#x27;联名上折&#x27;、&#x27;请开国会&#x27;这些字样？容大人，您是读书人，您给咱说说，这算不算——妄议朝政？&quot;</p>\n<p>容闳没有说话。他明白了——那封&quot;寻常公文&quot;是容星桥故意留的饵，为的是引开视线；可他也同时明白，容星桥在信里顺手写下的那两句密议，已经被捕役抓在手里了。</p>\n<p>&quot;容大人，&quot;武官把那封信叠好，收进怀里，&quot;今夜打扰了。这封信，咱得带回去，请军机处的大人们过目。&quot;</p>\n<p>容闳站在被翻得一片狼藉的院子里，看着捕役们扬长而去。他只觉得自己一生所求的&quot;立宪&quot;&quot;民权&quot;，在这一夜，显得那样遥远、那样可笑。</p>\n<p>——他连自己族侄的一封信，都护不住。</p>\n<p>第二日一早，容星桥被捕。</p>\n<p>罪名是&quot;假托海军公务，密传妄议朝政之书&quot;。他被步军统领衙门押走时，路过储材馆门口，看见容闳站在门内，冲他笑了笑，用唇语说了两个字：</p>\n<p>&quot;没事。&quot;</p>\n<p>容闳站在门内，看着族侄被五花大绑地带走，心里忽然涌起一股说不清的悲凉。</p>\n<p>他想起同治十一年，自己送那批孩子出洋时，对每一个孩子说过的话：&quot;你们这一去，是替这个国家，去看一看外面的世界有多大。&quot;</p>\n<p>二十四年了。他亲手送出去的种子，一个接一个地，回来报效这个国家。</p>\n<p>如今，其中一颗种子，正被这个国家，按在泥里，碾进土里。</p>"}, {"title": "第7章：横滨茶室里的一句底牌", "html": "<p>光绪二十二年（公元1896年）初夏，朝廷派使团赴日本，议甲午战后善后之事。</p>\n<p>名义上是&quot;善后&quot;，其实是善财——黄海一役虽侥幸取胜，日本却不肯就此罢休，在朝鲜半岛、辽东边境屯兵不去，列强又在一旁虎视眈眈。朝廷不愿再起战端，便遣使赴日，想用外交手段，把这场战争&quot;善&quot;成一个皆大欢喜的结局。</p>\n<p>使团正使是侍郎衔的翁同龢门下的一位道员，副使便是李鸿章特意点派的唐绍仪。</p>\n<p>唐绍仪此时已是洋务储材馆的一员，因通晓日文、英文、交涉干练，被李鸿章相中，拔擢为使团副使。上船那日，李鸿章亲自送到码头，握着他的手，低声说了一句话：</p>\n<p>&quot;绍仪，此去日本，你要记住：咱们不是去乞和的，是去给黄海的弟兄们，讨一个公道回来。&quot;</p>\n<p>唐绍仪心里一热，却又隐隐觉得，这句话里有别的意思。</p>\n<p>船到了日本，住进横滨的迎宾馆，正使先去拜会日方要人，留下唐绍仪与几名随员在馆中等候。当夜，唐绍仪正在灯下翻看带来的地图、条约文本，忽然有人递来一张名刺——是日本外务省的官员，约他&quot;私下叙话&quot;。</p>\n<p>唐绍仪沉吟片刻，去了。</p>\n<p>那日本官员在茶室等他用日本茶道招待他，言语间，不动声色地打听：此番中方何人来议，李鸿章中堂身子可好，北洋水师黄海一役后，尚余几艘堪战之舰？</p>\n<p>唐绍仪端着茶盏，一盏一盏地喝着，把话题一个个地挡了回去。他心里清楚，这个日本官员今夜请他喝茶，不是叙什么&quot;两国之谊&quot;——是来探他的底，摸中方的底牌。</p>\n<p>&quot;阁下放心，&quot;那日本官员最后笑着说，&quot;中日两国，一衣带水，岂有永世为仇之理？此番议和，只要贵国肯让一步，我两国，从此便可和睦如初。&quot;</p>\n<p>&quot;让一步？&quot;唐绍仪放下茶盏，&quot;阁下说的&#x27;让一步&#x27;，指的是什么？&quot;</p>\n<p>&quot;比如，&quot;那官员笑了笑，&quot;朝鲜之事。&quot;</p>\n<p>唐绍仪心里一动。他明白了——日本人是想借着善后谈判，把朝鲜从中国的藩属，撬成日本的禁脔。这是要钱要地，还想要朝鲜的宗主权。</p>\n<p>&quot;朝鲜之事，&quot;唐绍仪缓缓说，&quot;自有我朝与贵国共同商议。但有一事，容在下直言——黄海一役，贵国海军沉舰虽少，元气却已大伤。若贵国执意要在朝鲜挑起事端，恐怕下一次海上相见，就不只是善后谈判这么简单了。&quot;</p>\n<p>那日本官员的笑容，微微僵了一下。</p>\n<p>唐绍仪起身告辞。走到门口，他又回头说了一句：&quot;在下是北洋的人，方才那番话，只作在下私下一说，非朝廷之意。阁下若以此上告，在下便说，阁下听错了。&quot;</p>\n<p>他微微一笑，转身离去，留下那日本官员坐在茶室里，面色阴晴不定。</p>\n<p>回到迎宾馆，唐绍仪把今晚的情形，连夜写成一封密信，送回天津。</p>\n<p>他没有报&quot;敌情&quot;，也没有报&quot;我方胜算&quot;。他只写了一句话：日本人之意，不在和，在朝鲜。若能以&quot;让朝鲜&quot;换&quot;停战&quot;，则朝鲜必失；若坚不让步，则恐再启战端。绍仪窃以为，朝鲜可让之半，而不可全让；让之半，则保藩篱，让之全，则失其门户。</p>\n<p>这封信送到李鸿章案头，李鸿章看了很久。</p>\n<p>次日，李鸿章拍来一封电报，只有九个字：朝鲜之事，可让其半，不可全让。</p>\n<p>唐绍仪接到电报，这才明白了李鸿章为什么选他做这个副使。</p>\n<p>李鸿章要的，不是他唐绍仪去说服日本——日本人的算盘，李鸿章比谁都清楚。他要的，是唐绍仪这个人，既能听懂日本人的话，又能替李鸿章在谈判桌上，守住那&quot;可让之半，不可全让&quot;的底线。</p>\n<p>换句话说，李鸿章要唐绍仪做的，是替他在外交上，下一盘他本人下不动的棋。</p>\n<p>谈判正式开始那天，日方果然狮子大开口，提出&quot;朝鲜为独立国，中日共保&quot;&quot;赔偿军费&quot;&quot;开放通商口岸&quot;等条款。正使听了，面有难色，几欲松口。</p>\n<p>唐绍仪在旁边，忽然开口了。</p>\n<p>&quot;朝鲜为贵国所请之&#x27;独立&#x27;，我方可以商议。&quot;他说，&quot;然&#x27;共保&#x27;二字，须改为&#x27;两国共同声明，尊重朝鲜自主&#x27;——不然，我朝无以对天下。&quot;</p>\n<p>日方代表对视一眼，松了一步。</p>\n<p>&quot;至于赔偿军费，&quot;唐绍仪接着说，&quot;黄海一役，我朝沉舰五艘，贵国沉舰一艘。若论军费，恐怕该是我方向贵国索赔。&quot;</p>\n<p>日方代表脸色一变，正要发作，唐绍仪已经自顾自地翻开带来的卷宗，把黄海之战的双方损失，一条条念了出来——日期、舰名、吨位、沉没地点、伤亡人数，巨细靡遗。</p>\n<p>&quot;这些数字，&quot;他合上卷宗，缓缓说，&quot;不是我编的，是贵国自己的报纸登的。若贵国执意索赔，在下只好把这些材料，一并呈交各国公使，请他们评理。&quot;</p>\n<p>日方代表沉默了。</p>\n<p>谈判桌上，唐绍仪以一己之力，把日方开出的条件，一条一条地砍了下去。他没有让日方占得便宜，也没有让日方完全落空——他按照李鸿章&quot;可让其半&quot;的指示，在朝鲜、通商等次要条款上，退了一小步；在赔偿、割地等要害条款上，寸步不让。</p>\n<p>最后，条约定下来，日方所得，不过朝鲜之一半宗主权、若干通商便利；中国所得，则是一纸停战之约，保住了辽东，也保住了颜面。</p>\n<p>回程的船上，唐绍仪独自站在甲板上，看着渐渐远去的日本海岸线。</p>\n<p>他心里没有一丝得胜的喜悦。他比谁都清楚，这份条约，是李鸿章算盘上的一颗珠子——李鸿章用&quot;让朝鲜之半&quot;的让步，换取了朝廷对&quot;洋务、立宪&quot;的默许；而他唐绍仪，是那颗被拨动的珠子。</p>\n<p>&quot;绍仪，&quot;同行的正使走进来，拍拍他的肩，&quot;你这一趟，替朝廷争了脸了。&quot;</p>\n<p>唐绍仪笑了笑，没有接话。</p>\n<p>他想起李鸿章在码头送他的那句话：&quot;不是去乞和的，是去给黄海的弟兄们，讨一个公道回来。&quot;</p>\n<p>他讨回来的这个&quot;公道&quot;，值多少钱？他不知道。</p>\n<p>他只知道，在他争下这份条约的同时，天津，李鸿章已经借着&quot;外交得胜&quot;的由头，把那份&quot;请立宪&quot;的奏折，递了上去。</p>\n<p>他站在甲板上，看着落日沉进海平线，心里忽然浮起一个念头：</p>\n<p>这场棋，他下了第一步。而下的那个人，从来不是他。</p>\n<p>三天后，船抵天津。码头上，迎接他的，除了朝廷的犒赏，还有一封盖着军机处印信的上谕：着唐绍仪，任总理各国事务衙门章京，专司交涉。</p>\n<p>他接旨的瞬间，抬头看了看天。</p>\n<p>初夏的阳光明晃晃的，照在码头的龙旗上。他把那封上谕在手里攥了攥，在心里对自己说：</p>\n<p>&quot;绍仪，这条路，你既然踏上了，就得走下去——不为别人，为你自己。&quot;</p>\n<p>他上了岸。码头上的鞭炮，正放得噼啪作响。</p>"}, {"title": "第8章：狱中只答一句话", "html": "<p>光绪二十二年（公元1896年）六月，容星桥已在狱中关押了两个月。</p>\n<p>这两个月里，容闳四处奔走，却处处碰壁。他去求过李鸿章，李鸿章说&quot;老夫正在设法，你且稳住&quot;；去求过张之洞，张之洞回函说&quot;楚地已有根基，此事当徐徐图之&quot;；去求过刘坤一，刘坤一答复&quot;两江不接此案公文&quot;——几个人话都说得很满，却没有一个人，真正把容星桥捞出来。</p>\n<p>容闳心里明白：他们不是不想救，是**不敢救**。案子正卡在&quot;私结朋党&quot;的边沿上，谁要是急吼吼地出面，就等于替容星桥认了那顶&quot;结党&quot;的帽子。到时候，救出来的不是容星桥，是四个人一起搭进去。</p>\n<p>他们都在等——等这阵风过去，等刚毅松手，等太后对这桩案子失去兴趣。</p>\n<p>可刚毅没有松手。</p>\n<p>他在等。等容星桥开口，等他供出那封联名折子背后的主使。</p>\n<p>狱中，容星桥被反复提审。刚毅亲自坐堂，问来问去，只有一句话：&quot;谁让你传这封信的？&quot;</p>\n<p>容星桥始终只有一句回答：&quot;是学生自己写的。学生不懂事，妄议朝政，罪该万死。&quot;</p>\n<p>&quot;你一个小小的海军军官，写得出那种话？&quot;刚毅冷笑，&quot;什么&#x27;联名上折，请开国会&#x27;——你身后没有人教，你写得出来？&quot;</p>\n<p>&quot;学生在美国读过书。&quot;容星桥说，&quot;见过什么叫国会。回来以后，心里存着念想，便写了。&quot;</p>\n<p>&quot;你美国读书？&quot;刚毅眯起眼，&quot;你是在给谁卖命？是李鸿章？还是那个姓容的老头？&quot;</p>\n<p>容星桥抬起头，看着刚毅，慢慢说：&quot;大人，学生在美国读的书，学的是自己拿主意。这封信，是学生自己写的，没有人指使。大人要问主使，学生没有主使——学生就是主使。&quot;</p>\n<p>刚毅盯着他看了很久，忽然笑了。</p>\n<p>&quot;好，&quot;他说，&quot;你嘴硬。你且等着。&quot;</p>\n<p>他转身走了。狱卒给容星桥上了刑——不是重刑，是那种慢慢磨人的刑法。容星桥被打得皮开肉绽，却始终咬紧牙关，一个字也没多吐。</p>\n<p>他知道，他背后那些人——李鸿章、张之洞、刘坤一、容闳——他们的命，都系在他这张嘴上了。他要是招了，就全完了。</p>\n<p>他不招。他宁可自己死在这牢里。</p>\n<p>六月末，唐绍仪在总理衙门得知了容星桥的消息。</p>\n<p>他刚在谈判桌上为朝廷争回了半个朝鲜，又蒙圣恩授了总理衙门章京的差事，本是风光无限的功臣，却在案头翻到刚毅报上来的那份案卷——容星桥的名字，赫然在上。</p>\n<p>&quot;星桥出事了？&quot;他惊得脸色发白，&quot;什么时候的事？&quot;</p>\n<p>&quot;四月。&quot;旁边的同僚低声说，&quot;储材馆被抄了，容星桥被抓了，罪名是妄议朝政。眼下刚毅正盯着这个案子，要往深里挖。&quot;</p>\n<p>唐绍仪站在案前，窗外的风灌进来，吹得他衣袍猎猎作响。他这才明白——他那场谈判，为朝廷争回来的东西，在刚毅眼里，恐怕还不如容星桥牢里那封&quot;妄议朝政&quot;的信值钱。</p>\n<p>他连夜赶到储材馆，见到了容闳。</p>\n<p>&quot;先生，&quot;他说，&quot;星桥怎么样了？&quot;</p>\n<p>容闳坐在灯下，人消瘦了一圈，眼睛却亮得吓人：&quot;还活着。被打了几顿，没招。&quot;</p>\n<p>&quot;那现在怎么办？&quot;</p>\n<p>&quot;等。&quot;容闳说，&quot;李鸿章在等太后对&#x27;立宪&#x27;松口。他说，只要太后松了口，这案子就是&#x27;新政前的不当言论&#x27;，轻拿轻放。可要是太后一直不松口……&quot;</p>\n<p>&quot;那星桥就一直在牢里。&quot;</p>\n<p>容闳没有说话。他望着窗外的夜色，过了很久，才说：</p>\n<p>&quot;绍仪，你说，我们这一群人，推立宪，开国会，为的是什么？&quot;</p>\n<p>唐绍仪愣住了。</p>\n<p>&quot;为的是，让这个国家，以后不再有这种冤枉。&quot;容闳说，&quot;可如今，立宪还没立成，倒先让星桥替它——替我们这个&#x27;为国为民&#x27;的念想——受了这一场。&quot;</p>\n<p>他声音有些发颤：&quot;绍仪，我不知道，这样值不值得。&quot;</p>\n<p>唐绍仪沉默了很久。</p>\n<p>&quot;先生，&quot;他忽然说，&quot;值不值得，不该由你一个人想。我明日，就上书替星桥鸣冤。&quot;</p>\n<p>&quot;你疯了？&quot;容闳猛地抬头，&quot;你刚谈完判回来，正是升迁的时候。你替一个&#x27;妄议朝政&#x27;的犯人鸣冤，不是把你自己也搭进去？&quot;</p>\n<p>&quot;先生，&quot;唐绍仪说，&quot;我替朝廷谈判，是替我自己的前程。可我替星桥鸣冤，是替我自己的良心。前程我争过了，良心，我不想丢。&quot;</p>\n<p>容闳看着他，只觉得，这个年轻人，比他自己勇敢得多。</p>\n<p>&quot;你等等。&quot;他说，&quot;先别急。你刚回来，身份正金贵，这一状上去，未必有用，倒白折了你。咱们先想办法，让李鸿章把折子递到太后面前。&quot;</p>\n<p>唐绍仪点了点头。可他还是写了一封《陈情书》，连同他在日本谈判的成果，一并递了上去——那封书里，他一句没提自己，只提了一件事：容星桥是北洋海军军官，是甲午那场仗里，随舰队拼过命的人。这样的人，不该被当成&quot;妄议朝政&quot;的罪人，关在牢里。</p>\n<p>这封信，兜兜转转，最后送到了一个人的案头。</p>\n<p>——光绪皇帝。</p>\n<p>年轻的皇帝读完唐绍仪的陈情书，又翻出刚毅报上来的案卷，看了整整一夜。</p>\n<p>他看见案卷里，容星桥的供词，翻来覆去只有一句话：&quot;是学生自己写的，没有人指使。&quot;</p>\n<p>他想起容闳当年托人捎给他的那句话：&quot;皇上若要亲政，不妨借立宪之名。天下之势，可借力而为，不必力抗。&quot;</p>\n<p>他坐在灯下，看着那页供词，忽然笑了。</p>\n<p>&quot;刚毅啊刚毅，&quot;他轻声说，&quot;你挖了一辈子别人的错，却不知道，朕等的，就是你这一下。&quot;</p>\n<p>他提起笔，在那份案卷上，批了四个字：</p>\n<p>&quot;从宽发落。&quot;</p>\n<p>这份朱批，第二天便发回了军机处。</p>\n<p>刚毅看着那四个字，气得浑身发抖，却一句话也说不出来——皇帝亲自朱批，他一个军机大臣，总不能抗旨。</p>\n<p>容星桥被放了出来，虽革去了海军军官的职务，但保住了性命，也保住了他背后那一群人。</p>\n<p>他走出大牢那天，是个阴天。他站在牢门外，看着来接他的容闳和唐绍仪，忽然笑了笑，说：</p>\n<p>&quot;叔叔，绍仪，那封信，我到底还是没招。&quot;</p>\n<p>容闳看着他，眼泪一下子涌了出来。</p>\n<p>&quot;我知道。&quot;他说，&quot;我知道你不会招。&quot;</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;因为你在美国学的第一句话，&quot;容闳说，&quot;就是&#x27;自己拿主意&#x27;。&quot;</p>\n<p>容星桥愣了愣，随即笑了。他笑得眼角沁出了泪。</p>\n<p>那天夜里，容闳送走唐绍仪，独自坐在灯下，把那本名册翻开，在容星桥的名字旁边，用笔，重重地，画了一个圈。</p>\n<p>他忽然觉得，这一夜，他送出去的那些孩子，终于，有人替他，接住了这个国家第一记闷棍。</p>"}, {"title": "第9章：一条不该存在的弯线", "html": "<p>光绪二十二年（公元1896年）夏，朝廷议修铁路。</p>\n<p>海防会议之后，李鸿章与张之洞各自上折，争办铁路。李鸿章要修关内外铁路，以通东三省；张之洞要修卢汉铁路，以通南北。两套方案，两条路线，两笔经费，在朝堂上吵得不可开交。</p>\n<p>最后，皇帝朱批：两路并修，分段办理。关内铁路由北洋主持，卢汉铁路由湖广主持，各拨专款，限期五年。</p>\n<p>詹天佑被派往卢汉铁路段，任总工程师。</p>\n<p>他接到调令那天，站在唐山那段他修了多年的铁轨上，看着伸向远方的路基，站了很久。这条铁轨，是他一点点量出来的，一根根枕木铺起来的，如今要他离开，去另一个地方从头开始——他心里，说不清是什么滋味。</p>\n<p>&quot;詹工，&quot;随行的年轻助手在旁边唤他，&quot;张制台（总督）请您明日赴武昌面商铁路事宜。&quot;</p>\n<p>詹天佑回过神，点了点头：&quot;知道了。&quot;</p>\n<p>第二日，他乘船溯江而上，到了武昌。</p>\n<p>张之洞在制台衙门后园见他。湖广总督穿一件石青色长袍，手持一柄团扇，坐在石桌旁，桌上摆着茶，却没有茶碗——只有一个摊开的卷轴，画着一条蜿蜒的线。</p>\n<p>&quot;詹先生，&quot;张之洞招呼他坐下，&quot;这是老夫命人绘的卢汉铁路全图。你来看看，这条线，走得如何？&quot;</p>\n<p>詹天佑凑近看了一会儿。那张图画得极精美，山川城池，历历在目，却有一条不对——铁路的走向，在湖北境内绕了一个大弯，避开了沿途的县城、村镇，专挑着荒山野岭而过。</p>\n<p>&quot;制台，&quot;詹天佑斟酌着说，&quot;此图虽工，然路线似有可商之处。铁路贵在运输，当经人口稠密、商旅辐辏之地，方能货运两旺。此图绕过诸多县城，恐怕……&quot;</p>\n<p>张之洞打断他：&quot;詹先生有所不知。铁路所经之地，地价必涨，民情必变。若经城镇，则拆迁之费、安置之烦，动辄数百万。老夫避其繁而取其简，是为朝廷省钱。&quot;</p>\n<p>詹天佑张了张嘴，忽然明白了。</p>\n<p>张之洞要的，不是一条能运货的铁路，是一条能&quot;名垂青史&quot;的铁路——线路越长、工程越难、越显其功；途经之地越荒、拆迁越少，便越少得罪人，越少担风险。至于这条铁路能不能真正利国利民，那不在他张之洞的算盘上。</p>\n<p>&quot;制台，&quot;詹天佑缓缓说，&quot;若按此图，线路绕行山野，工程难度倍增，造价只怕比经城镇更贵。且日后通车，货运稀少，运费难偿，恐成虚设。&quot;</p>\n<p>张之洞的眉头，几不可察地皱了一下。</p>\n<p>&quot;詹先生过虑了。&quot;他说，&quot;卢汉铁路，乃老夫一手筹划。先生只管按图施工，其余之事，不劳先生费心。&quot;</p>\n<p>詹天佑看着这位总督。他想起容闳当年在船上对他说的话：这世上，画图的人很多，肯把图变成路的人很少。他这些年，在美国、在中国，见过太多这样的人——他们画图，他们立项，他们拨款，他们造出一座座&quot;名垂青史&quot;的工程，然后让真正干活的人，去填那些图纸上的窟窿。</p>\n<p>他沉默了一会儿，说：&quot;制台，晚辈有一言，不知当讲不当讲。&quot;</p>\n<p>&quot;讲。&quot;</p>\n<p>&quot;这条铁路，若按此图修成，&quot;詹天佑一字一句地说，&quot;十年后，它只会是这纸上的一条线，而不会是贯穿南北的一条血脉。到时候，朝廷问责，制台您可以说&#x27;老夫按图施工，何罪之有&#x27;；可我詹天佑，却没法对那些指着铁路吃饭的百姓，说这句话。&quot;</p>\n<p>张之洞手里的团扇，停住了。</p>\n<p>他盯着詹天佑看了很久。这位湖广总督一生自负，向来容不得别人说他半点不是；可眼前这个年轻工程师的目光，却让他一时不知如何反驳。</p>\n<p>&quot;先生请回。&quot;张之洞终于说，&quot;此事，容老夫再思。&quot;</p>\n<p>詹天佑躬身告退。走出制台衙门时，他回头看了一眼那后园的方向，心里明白：这一局，他争的不是这条铁路——他争的，是这个国家，将来能不能真的有一条&quot;血脉&quot;。</p>\n<p>他离开武昌，没有回唐山，而是转道去了天津，去见李鸿章。</p>\n<p>李鸿章听完他的叙述，捻着胡须，半晌没有说话。</p>\n<p>&quot;制台大人的意思，&quot;詹天佑说，&quot;是让晚辈按图施工。可晚辈以为，此路若成，必成废路。中堂若允，晚辈愿以北洋之力，另择一条更利国用的路线，与制台大人分庭抗礼。&quot;</p>\n<p>李鸿章看着这个年轻人，忽然笑了。</p>\n<p>&quot;詹工，&quot;他说，&quot;你可知你方才这番话，是在老夫面前，说张香涛的不是？&quot;</p>\n<p>&quot;晚辈知道。&quot;</p>\n<p>&quot;你可知，若老夫将这番话奏明朝廷，&quot;李鸿章慢悠悠地说，&quot;你詹天佑，便成了挑拨督抚之嫌？&quot;</p>\n<p>&quot;晚辈知道。&quot;詹天佑说，&quot;但晚辈更知道，若晚辈不把这句话说出来，他日这条废路修成，朝廷失了银子，百姓误了生计，晚辈这一身本事，便算是白学了一场。&quot;</p>\n<p>李鸿章沉默了一会儿。他望着窗外，过了很久，才缓缓说：</p>\n<p>&quot;詹工，你说得对。可老夫要问你一句：你知道这条铁路，为什么非要争吗？&quot;</p>\n<p>&quot;为了运兵、运货、强国。&quot;</p>\n<p>&quot;不。&quot;李鸿章摇摇头，&quot;老夫与张香涛争这条铁路，不是因为它是铁路。是因为，谁修成了这条铁路，谁便是&#x27;开中国铁路之先河&#x27;的人。这笔账，要算在千秋史册上。老夫争的不是路，是名分。&quot;</p>\n<p>他说到这里，忽然停住了。</p>\n<p>&quot;可你方才那番话，&quot;他看着詹天佑，&quot;让老夫忽然觉得，老夫争的这些东西，都还不如你手里那把量轨的尺子实在。&quot;</p>\n<p>詹天佑没有说话。</p>\n<p>他懂了，容闳当年把孩子们送过大洋，赌的不是一艘船、一座厂，而是这个国家的将来。这个国家，这些大人物，他们争名、争利、争权、争地盘——可终究，还是有那么一小撮人，在争这条铁路到底该怎么修，能不能真的让南北通起来。</p>\n<p>他走出中堂府时，李鸿章在身后叫住他：&quot;詹工，你若执意要改这条路线，老夫可以为你说话。但你要记住：你改的不是一条线，是张香涛的面子。此一去，你就把湖广那边，得罪了。&quot;</p>\n<p>詹天佑站住，没有回头。</p>\n<p>&quot;中堂，&quot;他说，&quot;晚辈这辈子，量过太多线了。有些线，是替别人量的；这条线，晚辈想替这个国家量一次。&quot;</p>\n<p>他大步走进夏日的阳光里，背影被日光拉得很长，很长。</p>"}, {"title": "第10章：舰队与小站的银子之争", "html": "<p>光绪二十二年（公元1896年）冬，海军衙门。</p>\n<p>萨镇冰走进这座挂着&quot;海军衙门&quot;匾额的院子时，闻到一股陈旧的霉味。院子很静，静得不像一个掌握着远东最大海军的地方。廊下晾着几件旧制服，石阶缝里长出了青苔，唯有正中那间大堂还亮着灯，隐隐传出算盘的声响。</p>\n<p>萨镇冰是北洋水师的一名管带，福建船政学堂出身，早年与严复、刘步蟾同批赴英国格林威治皇家海军学院深造，黄海之役后因功升任左翼总兵，分管舰队事务。今日他来，是为北洋水师明年的军费，与海军衙门的堂官们当面议事。</p>\n<p>&quot;萨总兵，&quot;一位堂官见他进来，连忙迎上来，&quot;您来得正好。户部拨给咱们的银子，已经定了。只是……&quot;</p>\n<p>&quot;只是什么？&quot;</p>\n<p>&quot;只是数目，&quot;堂官压低了声音，&quot;比往年，少了两成。&quot;</p>\n<p>萨镇冰没有立刻说话。他走进大堂，看见桌上摊着一本账册，上头密密麻麻记着各舰的开销：燃料、弹药、修船、伙食、俸饷……他看了半晌，抬起头问：&quot;少的那两成，拨到哪去了？&quot;</p>\n<p>堂官左右看了看，凑到他耳边，低声说了一句。</p>\n<p>&quot;拨给小站了。&quot;</p>\n<p>萨镇冰的手，停在了账册上。</p>\n<p>小站。袁世凯练兵的地方。朝廷近年来大力扩充陆军，新式洋操军，一营一营地建起来，用的是最先进的洋枪，穿的是最整齐的军装。而海军——这支曾让日本人闻风丧胆、在黄海上用命换回胜利的舰队，正在一条一条地，被抽干。</p>\n<p>&quot;萨总兵，&quot;堂官小心翼翼地说，&quot;朝廷的意思是，海战已毕，倭患暂息，陆防要紧。北洋水师……先修整着，不必添舰。&quot;</p>\n<p>萨镇冰沉默了。</p>\n<p>他忽然想起黄海之战。那场仗，北洋水师沉了五艘，死了数百人，才换回一个&quot;大捷&quot;。他想起陈金揆，那个在致远上差点没命回来的留美幼童；想起邓世昌，那个最后站在飞桥上的管带；想起刘步蟾、林泰曾，那些与他同批赴英、登舰实习的同窗——北洋水师的上层将领多是船政系留英生，中层军官则是留美幼童，这两拨人，当年漂洋过海，学回来的本事，全在那一仗里，用命换了出去。</p>\n<p>他们用命换回来的东西，如今，正被人用算盘，一颗珠子一颗珠子地拨出去。</p>\n<p>&quot;堂官，&quot;萨镇冰缓缓开口，&quot;末将有一事不明。若他日倭寇再来，海战再起，咱们这支&#x27;修整着&#x27;的水师，拿什么迎敌？&quot;</p>\n<p>堂官搓着手，不敢接话。</p>\n<p>&quot;末将知道了。&quot;萨镇冰没有追问，他合上账册，转身离去。</p>\n<p>他没有去海军衙门的堂官们那里争取——他知道，那不管用。他直接去了一趟天津，去找李鸿章。</p>\n<p>李鸿章听完他的话，久久没有说话。这位北洋大臣端坐在花厅里，手里握着那杆水烟袋，烟早已熄了。</p>\n<p>&quot;镇冰，&quot;他缓缓说，&quot;你以为老夫不想给水师争钱？老夫争了。可如今朝廷的心，不在海上。他们以为倭患已了，天下太平，只要在陆上多练几支洋操军，便可高枕无忧。老夫争来的每一两银子，都是从户部那群老吏的手指缝里抠出来的。&quot;</p>\n<p>&quot;中堂，&quot;萨镇冰说，&quot;晚辈不要多，只要够修船、够买弹药、够养活弟兄们。&quot;</p>\n<p>李鸿章沉默了很久。</p>\n<p>&quot;镇冰，&quot;他终于说，&quot;老夫给你一句话。你记住——水师的银子，老夫会替你们争。但你也要记住，这世上，没有人会永远替你们争。你们能靠的，只有你们自己。&quot;</p>\n<p>&quot;晚辈明白了。&quot;</p>\n<p>&quot;你明白什么了？&quot;</p>\n<p>萨镇冰抬起头，看着李鸿章：&quot;晚辈明白，这支舰队，若想活下去，不能只靠朝廷的恩典。得让它，变成朝廷不能没有的东西。&quot;</p>\n<p>李鸿章看着他，忽然笑了一下，笑容里有几分赞许，也有几分说不出的苦涩。</p>\n<p>&quot;你去吧。&quot;他说，&quot;这件事，老夫会办。&quot;</p>\n<p>萨镇冰离去后，李鸿章坐在花厅里，坐了整整一夜。</p>\n<p>他当然知道，萨镇冰说得对。可他也知道，要把一支&quot;修整着&quot;的舰队，变成朝廷&quot;不能没有&quot;的东西，谈何容易。他望着窗外的夜色，想起自己当年在北洋操练水师时的雄心——那是几十年前的事了。</p>\n<p>如今，他的舰队老了，他的雄心也老了。</p>\n<p>而那位在小站练兵的袁世凯，正年轻。</p>\n<p>第二日，李鸿章上折，请朝廷整顿海军，重建舰队。他在折子里写道：海战一役，我北洋虽胜，然沉舰五艘，精锐尽丧。倭虽暂退，其患未除。今若以陆代海，则他日海疆有事，我无船可战，无兵可守，悔之晚矣。请拨专款，限期三年，重建海军，另购新舰。</p>\n<p>这道折子递上去，户部照例以&quot;库款支绌&quot;为名，只肯拨十之二三。</p>\n<p>李鸿章没有再争。他做了一件谁都没想到的事——他把他自家的银子，捐了出来，充作海军经费。</p>\n<p>北洋的将领们感动得热泪盈眶，都说&quot;中堂高义&quot;。</p>\n<p>只有容闳，在听到这个消息时，对詹天佑说了一句话：&quot;詹工，你信不信，中堂捐的那笔银子，不是给海军的？&quot;</p>\n<p>&quot;那给谁的？&quot;</p>\n<p>&quot;给天下的言官看的。&quot;容闳说，&quot;他要让满朝上下都看见，李中堂连自家的棺材本都捐了，海军岂能不办？他这一捐，比他上十道折子都管用。&quot;</p>\n<p>詹天佑沉默了一会儿，说：&quot;可这银子，确实是给了海军的。&quot;</p>\n<p>&quot;是啊。&quot;容闳说，&quot;所以他这一捐，既办了海军，又收买了人心，还堵了言官的嘴。一石三鸟。&quot;</p>\n<p>詹天佑没有说话。他只觉得，这个国家的兴亡，常常系在这样一些人的一念之间——他们的私心，和这个国家的公义，缠得那么紧，紧到分不清哪是私，哪是公。</p>\n<p>萨镇冰听到李鸿章捐银的消息，没有像其他人那样激动。</p>\n<p>他只在海军衙门的院子里站了一会儿，然后走回码头，看着那些泊在港中、日渐老旧的军舰，对他手下的一个年轻军官说：</p>\n<p>&quot;记住今天。这笔银子，不是朝廷给的，是李中堂拿自家性命赌来的。咱们这支水师，欠的不是朝廷，是李中堂一个人的情。&quot;</p>\n<p>&quot;那咱们，怎么还？&quot;</p>\n<p>&quot;还不了。&quot;萨镇冰看着那些军舰，&quot;只能，把船修好，把兵练好。等哪一天朝廷重新想起这支水师的时候，咱们得让朝廷看见，它还能打。&quot;</p>\n<p>他站在冬日的码头上，看着那些苍老的铁舰，心里忽然涌起一股酸涩。</p>\n<p>这世上的账，从来都不是算得清的。</p>"}, {"title": "第11章：太后要的体面", "html": "<p>光绪二十三年（公元1897年）春，立宪之议，终于传到了慈禧太后耳中。</p>\n<p>消息是军机处转呈的。先是容闳联名京中士绅，请开国会、立宪政；继而李鸿章、张之洞、刘坤一分别上折，附议其事；再是洋务储材馆诸生、京师学堂师生，联名呈请。</p>\n<p>一时间，朝野上下，风声鹤唳。</p>\n<p>慈禧太后看完奏折，没有发怒。她把那些折子一份一份地摞好，搁在案上，叫来了李鸿章。</p>\n<p>&quot;李中堂，&quot;太后端坐在榻上，声音不高不低，&quot;哀家听说，你要请皇帝立宪。&quot;</p>\n<p>&quot;是。&quot;李鸿章叩首。</p>\n<p>&quot;你可知道，&quot;太后慢慢地说，&quot;宪政一行，皇帝亲政，哀家便要退居后宫，从此不问朝政了？&quot;</p>\n<p>&quot;臣知道。&quot;</p>\n<p>&quot;那你为何还要立宪？&quot;</p>\n<p>李鸿章抬起头，看着这位统治了大清三十余年的太后。她老了，眼角的皱纹深了，可那双眼睛依然锐利，锐利得像一把刀。</p>\n<p>&quot;太后，&quot;李鸿章缓缓说，&quot;臣不敢欺瞒太后。臣请立宪，不为皇帝，不为天下，只为臣自己。&quot;</p>\n<p>太后挑了一下眉：&quot;哦？&quot;</p>\n<p>&quot;太后明鉴，&quot;李鸿章说，&quot;今日之天下，满汉相疑，君臣相猜，督抚各怀异志，朝野离心离德。若长此以往，不需三五年，这江山，便要不保。臣保了半辈子大清，不想眼睁睁看着它毁在臣的眼前。立宪，是臣能给这个朝廷，续命的方法。&quot;</p>\n<p>&quot;续命？&quot;太后冷笑一声，&quot;哀家倒要听听，你如何用这立宪，给大清续命。&quot;</p>\n<p>&quot;太后，立宪者，以法立国也。皇帝以宪法为纲，则天下臣民，皆有所循。督抚各守其职，兵将各安其位，满汉各得其权。则朝廷之政，有条不紊；地方之乱，无从滋生。此，为续命之方。&quot;</p>\n<p>太后没有立刻接话。她垂下眼帘，过了很久，才缓缓开口：</p>\n<p>&quot;李中堂，你说的这些，哀家大半听不懂。哀家只问你一句话——若立宪，哀家这个太后，还算不算数？&quot;</p>\n<p>&quot;太后位尊，与国同休。&quot;李鸿章说。</p>\n<p>&quot;哀家死后呢？&quot;</p>\n<p>&quot;太后千秋之后，子孙承袭，永享尊荣。&quot;</p>\n<p>&quot;那皇帝呢？皇帝是不是就不用听哀家的了？&quot;</p>\n<p>李鸿章沉默了一会儿，说：&quot;宪政既行，皇帝自当以宪法为纲，垂拱而治。&quot;</p>\n<p>太后的目光，忽然变得锋利起来。她盯着李鸿章看了很久，然后，忽然笑了。</p>\n<p>&quot;李中堂，&quot;她说，&quot;你绕了这半天的弯子，哀家总算听明白了。你是要哀家把权交出去，让皇帝做一个&#x27;以宪法为纲&#x27;的皇帝，让那些督抚各守其职，让满汉各得其权——说来说去，你是要哀家这个老婆子，靠边站。&quot;</p>\n<p>李鸿章叩首，没有辩解。</p>\n<p>&quot;哀家问你，&quot;太后忽然收敛了笑容，声音沉下来，&quot;若哀家不答应呢？&quot;</p>\n<p>&quot;太后不答应，&quot;李鸿章缓缓说，&quot;则督抚离心，新政废弛，朝野失望，他日之患，恐不在外，而在内。&quot;</p>\n<p>太后沉默了很久。</p>\n<p>她坐在那张九龙靠背椅上，看着面前这个跪着的、侍奉了她大半辈子的大臣，忽然觉得，这座宫殿，这些人，这座江山，都在离她远去。</p>\n<p>她想起自己年轻时，从咸丰的妃子，一路走到太后的位子，中间经历了多少腥风血雨。她以为，只要她握着权，就没有人能撼动她分毫。</p>\n<p>可如今，她明白了——权这个东西，从来不是握在手里的，而是系在人心上的。当人心都向着立宪，向着那个年轻皇帝的时候，她手里那点权，就只是一捧流沙。</p>\n<p>&quot;李中堂，&quot;太后终于开口，声音很轻，&quot;哀家可以答应立宪。但哀家有三个条件。&quot;</p>\n<p>&quot;太后请讲。&quot;</p>\n<p>&quot;第一，&quot;太后竖起一根手指，&quot;宪政行之，须保满人之位。旗人生计，宗室俸禄，不得削减。&quot;</p>\n<p>&quot;臣遵旨。&quot;</p>\n<p>&quot;第二，&quot;太后竖起第二根手指，&quot;皇帝新政，须尊哀家为圣母皇太后，凡事咨询，不得擅断。&quot;</p>\n<p>&quot;臣遵旨。&quot;</p>\n<p>&quot;第三，&quot;太后竖起第三根手指，声音忽然沉了下来，&quot;哀家膝下无子，皇帝是哀家一手带大的。哀家不要别的，只求哀家死后，能以一个体面的太后之礼，葬入皇陵。&quot;</p>\n<p>李鸿章听着，心里忽然一酸。他抬起头，看见太后的眼睛里，有一丝从未见过的、苍老的光。</p>\n<p>他明白了，这位统治了清帝国三十余年、杀伐决断、权倾天下的女人，此刻答应立宪，不是因为她开明，不是因为她认输——是因为她看清了，这座江山，已经撑不住了；而她，只想在还能的时候，替自己和皇族，保住最后一点体面。</p>\n<p>&quot;太后放心。&quot;李鸿章郑重叩首，&quot;这三条，臣以性命担保。&quot;</p>\n<p>太后没有再说话。她望着窗外，望着那片她看了四十年的宫墙，过了很久，才轻轻地说：</p>\n<p>&quot;李中堂，你退下吧。&quot;</p>\n<p>李鸿章退出殿外，站了很久，才慢慢地走下了台阶。</p>\n<p>身后，那座大殿的门，缓缓关上了。</p>\n<p>容闳在宫门外等他。李鸿章走到他面前，没有说话，只把一张薄薄的纸，递给了他。</p>\n<p>那是太后的懿旨草稿，上面写着：准立宪之议，设宪政编查馆，敕李鸿章、张之洞、刘坤一等督抚会同拟订宪法。着皇帝监国，总理宪政事宜。</p>\n<p>容闳看着那几个字，手微微发抖。</p>\n<p>&quot;中堂，&quot;他低声说，&quot;太后……答应了？&quot;</p>\n<p>&quot;答应了。&quot;李鸿章说，&quot;她答应，不是为了我，不是为了皇帝，是为了她自己的体面，和皇族的存续。&quot;</p>\n<p>容闳沉默了一会儿，说：&quot;可不管她为了什么，这道懿旨，终究是把门打开了。&quot;</p>\n<p>李鸿章没有说话。他望着紫禁城的宫墙，那墙在夕阳下泛着金红色的光，像一张被慢慢掀开的、陈旧的帷幔。</p>\n<p>&quot;纯甫，&quot;李鸿章忽然说，&quot;你知道太后为什么答应得这么干脆吗？&quot;</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;因为她看出来了，&quot;李鸿章说，&quot;她这四十年的权，不是靠她一个人撑住的，是靠这满朝文武、天下督抚的默许撑住的。如今，这些人默许的对象，换成了立宪。她若不答应，她就什么都没有了。她答应，至少，还能保一个&#x27;圣母皇太后&#x27;的名分。&quot;</p>\n<p>容闳听着，只觉一阵寒意。</p>\n<p>他想起那些在万寿宴上朝太后叩首的百官，想起那些山呼&quot;万寿无疆&quot;的太监，想起那九十九盏琉璃宫灯下，那张明黄寿字袍里端坐的老人。</p>\n<p>如今，那座宫殿的主人，终于也要退了。</p>\n<p>&quot;纯甫，&quot;李鸿章拍了拍他的肩，&quot;立宪，只是第一步。往后，路还长。你且看着，这满朝文武，谁会在这条路上，先倒下去。&quot;</p>\n<p>容闳没有说话。他看着夕阳下那堵宫墙。二十多年前，也是在这样的天色里，他站在甲板上，答不出一个孩子的问题。</p>\n<p>如今，他终于可以回答了。</p>\n<p>&quot;美国够大，&quot;他轻声说，&quot;大到装得下很多东西。可中国，也该够大，大到——装得下我们自己。&quot;</p>\n<p>他转身，大步向宫门外走去。</p>\n<p>身后，紫禁城那扇厚重的大门，在暮色里，缓缓地，关上了。</p>"}, {"title": "第12章：宪法第一条", "html": "<p>光绪二十三年（公元1897年）秋，宪政编查馆成立。</p>\n<p>馆设于总理衙门西侧一所旧院，李鸿章领衔，张之洞、刘坤一挂名参预，另从洋务储材馆、京师学堂、各直省调来通晓时务的官员数十人，会同编修。容闳亦在其中，专司起草宪法条文。</p>\n<p>他走进编查馆那日，看见满院新铺的砖地、新挂的匾额、新置的桌椅，心里却空落落的。他知道，宪法这东西，写得再好，也不过是纸上的条文；真正要紧的，是那些落笔的人，各自想在纸上写下什么。</p>\n<p>果然，编查馆开议第一天，各方就在第一条上争了起来。</p>\n<p>&quot;君主立宪，当以君权为纲。&quot;张之洞捻着胡须，掷地有声，&quot;宪法首条，当明定皇帝为国家元首，总揽大权。&quot;</p>\n<p>&quot;香涛所言极是。&quot;李鸿章慢悠悠地接道，&quot;然君主之权，亦当有所限制。不然，宪法与上谕何异？&quot;</p>\n<p>&quot;中堂之意，是要限制君权？&quot;</p>\n<p>&quot;不敢。&quot;李鸿章说，&quot;老夫只想问一句：若君主之权，不受任何限制，那立宪与不立宪，有何分别？督抚之权，臣民之权，又从何而来？&quot;</p>\n<p>张之洞一时语塞。</p>\n<p>容闳坐在角落，看着这场争论，心里雪亮。</p>\n<p>张之洞要的是&quot;君权为纲&quot;——不是因为他是忠臣，而是因为他的湖广新政、他的实业学堂，需要皇权的背书。皇权越重，他张之洞借着皇命办的事，便越名正言顺。</p>\n<p>李鸿章要的是&quot;限制君权&quot;——不是因为他是逆臣，而是因为他的淮系、他的洋务，需要一个不受皇帝一人喜怒左右的制度。皇帝若一言可废洋务，那他李鸿章几十年的心血，便随时可能化为乌有。</p>\n<p>这两人，一个要君权替自己背书，一个要制度替自己护身——都冠冕堂皇，都为国为民，也都，各怀私心。</p>\n<p>刘坤一在一旁，只喝茶，不发言。他等两人争得差不多了，才放下茶盏，慢悠悠地开口：</p>\n<p>&quot;二位所争者，君权也。然老夫以为，今日立宪，首要在定地方之权。两江、湖广、直隶，各守其土，各理其财，此乃立国之基。宪法若不保地方之权，则他日督抚离心，新政亦难久行。&quot;</p>\n<p>他这句话一出口，张之洞和李鸿章同时看了他一眼。</p>\n<p>容闳心里又是一凛。刘坤一这一句，是替两江要权——他要的不是宪政，是&quot;藩镇合法化&quot;。他要借着立宪，把他刘坤一在东南半壁说一不二的权柄，写进宪法里去。</p>\n<p>袁世凯坐在末席，一直没说话。</p>\n<p>等众人都争得口干舌燥，他才缓缓开口：&quot;诸位大人所言，皆国家大计。晚辈愚见：宪法立了，还要有人执行。若无一支听命于宪法的新军，则宪法便只是纸上空文。故晚辈以为，宪政之设，当以整军经武为先。&quot;</p>\n<p>他这番话，说得极谦逊，容闳却听出了弦外之音。</p>\n<p>袁世凯要的，是&quot;整军经武&quot;四个字——借着立宪的由头，把他那支新练的洋操军，从&quot;袁世凯的私兵&quot;，变成&quot;宪法的军队&quot;。将来宪法一立，谁掌握着这支&quot;宪法的军队&quot;，谁，便是这个国家真正的支柱。</p>\n<p>容闳只觉一阵发冷。</p>\n<p>他环顾这间屋子——张之洞要皇权，李鸿章要制度，刘坤一要地方，袁世凯要军权。四个人，四个算盘，却都挤在这张草拟宪法的桌前，争先恐后地，要把自己的私心，写进这个国家未来的根本大法里去。</p>\n<p>他拿起笔，看着面前那张空白的稿纸，忽然不知道，这第一笔，该落在哪里。</p>\n<p>散会时，容闳留到了最后。</p>\n<p>他独自坐在空荡荡的编查馆里，看着窗外渐暗的天色。桌上摊着他草拟的宪法初稿，第一条还空着。</p>\n<p>&quot;先生。&quot;一个声音忽然在门口响起。</p>\n<p>容闳抬头，看见唐绍仪站在门口，手里捧着一摞文书。</p>\n<p>&quot;绍仪，&quot;容闳招呼他，&quot;你怎么来了？&quot;</p>\n<p>&quot;总理衙门让我把各国宪法送过来，供编查馆参考。&quot;唐绍仪走进来，把文书放在桌上，看了他一眼，&quot;先生，您一个人坐在这儿，是不是……为难？&quot;</p>\n<p>容闳沉默了一会儿，说：&quot;绍仪，你说，这宪法，到底该是替谁写的？&quot;</p>\n<p>唐绍仪想了想，说：&quot;先生，晚辈在美国读书的时候，读过一句外国名言：&#x27;宪法不是一张纸，是一个国家的心。&#x27;晚辈以为，这宪法，既不能替张制台写，也不能替李中堂写，更不能替太后、替皇帝写——它得替这个国家的百姓写。百姓要什么，它就写什么。&quot;</p>\n<p>容闳抬起头，看着这个年轻人。他想起，唐绍仪当年在美国，能把一部《联邦宪法》从头背到尾。</p>\n<p>&quot;可是绍仪，&quot;容闳说，&quot;这编查馆里，没有百姓。&quot;</p>\n<p>唐绍仪沉默了一会儿，说：&quot;那先生，您就替他们写。&quot;</p>\n<p>&quot;我替他们写？&quot;</p>\n<p>&quot;先生，&quot;唐绍仪看着他，一字一句地说，&quot;您送我们出洋，教我们看这世界。如今，该轮到您，替这世界，写一笔了。&quot;</p>\n<p>容闳没有说话。他看着窗外，过了很久，才拿起笔，在宪法初稿的第一条上，写下了几个字。</p>\n<p>&quot;中国之立宪，以保民为先。民权所在，即国家命脉所系。&quot;</p>\n<p>他放下笔，抬头看着唐绍仪：&quot;绍仪，你记住——这一条，不是我容闳写的，是替那些一辈子没有出过乡、没读过书、却交着皇粮国税的百姓写的。&quot;</p>\n<p>唐绍仪郑重地点头：&quot;晚辈记住了。&quot;</p>\n<p>窗外，秋日的阳光透过窗纸照进来，照在那一行新写的字上，墨迹未干，微微发亮。</p>"}, {"title": "第13章：拆不散的野心", "html": "<p>光绪二十四年（公元1898年）夏，袁世凯的新军，已经扩成了北洋六镇。</p>\n<p>这位从朝鲜差任上回京的小小武弁，如今已是朝廷倚仗的新式陆军的统帅。他练兵有方，治军严明，麾下洋枪洋炮，兵强马壮。宪政既行，朝廷倚仗这支新军，袁世凯的声势，一时无两。</p>\n<p>而他的野心，也像那支新军一样，一天一天地膨胀起来。</p>\n<p>袁世凯开始向朝廷要权。他要兼领练兵处，要总揽全国军政，要插手铁路、电报、财政。他奏折里的措辞，越来越急切，越来越理直气壮——仿佛这个国家，离了他袁世凯，便再也转不动了。</p>\n<p>容闳看在眼里，忧在心里。</p>\n<p>他没有把这份忧虑对任何人说，只在一个深夜，去了一趟天津，见了李鸿章。</p>\n<p>&quot;中堂，&quot;容闳开门见山，&quot;袁世凯其人，可用，不可纵。&quot;</p>\n<p>李鸿章捻着胡须，没有立刻接话。过了半晌，他才缓缓说：&quot;纯甫，你这话，老夫何尝不知。可今日之局，朝廷要练新军，满朝文武，唯有他袁世凯练得动。老夫若动他，便是与朝廷的新政作对。&quot;</p>\n<p>&quot;中堂，&quot;容闳说，&quot;若容闳所料不差，袁世凯要的，不只是练兵。他要的，是这个国家的兵权。&quot;</p>\n<p>李鸿章看着他，沉默了很久。</p>\n<p>&quot;纯甫，&quot;他说，&quot;你可知道，老夫这一生，看人极准。老夫当年用他袁世凯，便是看他能练出别人练不出的兵。可老夫也从第一天起，就知道此人非池中之物。老夫只用其才，不托其心。你以为，老夫没有防着他？&quot;</p>\n<p>&quot;那中堂，打算如何防？&quot;</p>\n<p>李鸿章没有直接回答。他站起身，走到窗前，望着外面的夜色，过了很久，才缓缓说：</p>\n<p>&quot;老夫这一生，见过太多聪明人。他们都有一个通病——总觉得这天下，离了自己便转不动。袁世凯也是如此。可老夫知道，这天下，从来没有谁是不可替代的。你且看着，老夫要让他袁世凯知道，他练的兵，姓袁，可这天下，不姓袁。&quot;</p>\n<p>容闳离开天津后，李鸿章做了一件事。</p>\n<p>他上折，请朝廷设立陆军部，统筹全国军政；又奏请，将北洋六镇，划分隶属，分隶直隶、山东、河南、湖广数省，由各省督抚分统。</p>\n<p>这道折子递上去，袁世凯在天津得到消息，脸色铁青。</p>\n<p>&quot;李中堂这是要拆我的兵！&quot;他对身边的幕僚说，&quot;六镇分隶各省，我袁世凯的兵权，便去了一半！&quot;</p>\n<p>&quot;大人，&quot;幕僚劝道，&quot;中堂此举，恐非针对大人，实为宪政之需。陆军部统筹全国军政，也是题中应有之义。&quot;</p>\n<p>&quot;你不懂。&quot;袁世凯冷冷地说，&quot;李中堂老谋深算，他这一手，是把我袁世凯，从&#x27;天下第一统帅&#x27;，变成&#x27;各省练兵之一员&#x27;。他防的不是倭寇，是我。&quot;</p>\n<p>他忽然起身，在屋里来回踱了几步，停下来说：</p>\n<p>&quot;可是，李中堂忘了一件事。他以为拆了我的兵，我便成不了事。可他不明白——他这陆军部，他这分隶各省，恰恰替我做了一件事：把我袁世凯，从&#x27;李鸿章的门生&#x27;，变成了&#x27;朝廷的将领&#x27;。他拆的是我的私兵，却把我抬进了朝廷的堂奥。&quot;</p>\n<p>&quot;大人的意思是……&quot;</p>\n<p>&quot;等着看吧。&quot;袁世凯望着窗外，&quot;这盘棋，才刚刚开始。&quot;</p>\n<p>果然，陆军部成立后，袁世凯被任命为练兵处会办，名义上是中枢要员，实则练兵处总理由一位满族亲贵出任，袁世凯名为会办，处处受制。他那些以&quot;宪政军队&quot;之名练起来的洋操军，也被朝廷以&quot;统一编制&quot;为由，重新改编，划归各省。</p>\n<p>袁世凯的兵权，被拆得七零八落。</p>\n<p>可他非但没有失势，反而借着陆军部的差事，在朝中结交了大量权贵。他深知，今日之局，兵权虽然被拆，但只要他还在中枢，只要这国家还要练兵，他就有东山再起的一天。</p>\n<p>容闳看着这一切，心里五味杂陈。</p>\n<p>他终于明白，李鸿章对袁世凯的&quot;制衡&quot;，从来不是什么&quot;防奸臣窃国&quot;——而是四个字：权力之争。袁世凯的崛起，威胁的是李鸿章苦心经营了几十年的淮系地位，是张之洞、刘坤一这些老牌督抚的既得利益。他们联手架空袁世凯，不是因为他们看见了袁世凯将来会&quot;窃国&quot;，而是因为袁世凯将来若坐大，第一个被吞掉的，就是他们自己。</p>\n<p>这是一场旧时代的实权派，联手锁死新时代野心家的利益博弈。</p>\n<p>容闳把这个道理，想明白了。他只觉这场制衡，冷得让人心寒。</p>\n<p>&quot;先生，&quot;唐绍仪在一次夜谈中问他，&quot;您觉得，袁世凯此人，将来会如何？&quot;</p>\n<p>容闳沉默了很久，才说：&quot;绍仪，袁世凯此人，有才，有谋，有野心。他若生逢乱世，必是一代枭雄。可这个天下，偏偏不是他的天下。李中堂那一手，已经替这天下，画好了他的位置。&quot;</p>\n<p>&quot;什么位置？&quot;</p>\n<p>&quot;一个，永远够不到最高处的位置。&quot;容闳说，&quot;这个位置，朝廷需要他，可永远不会让他坐上去。&quot;</p>\n<p>唐绍仪沉默了一会儿，说：&quot;那先生，您觉得，这是好事，还是坏事？&quot;</p>\n<p>容闳想了想，说：&quot;对国家，或许是好事。对袁世凯，或许不是。可这世上的事，从来不是以一个人的得失来论的。&quot;</p>\n<p>他望着窗外的夜色，想起黄海之战后，陈金揆对他说的那句话：&quot;先生，致远没了。&quot;</p>\n<p>如今，袁世凯的新军还在，可袁世凯的野心，也被拆得七零八落了。</p>\n<p>他不知道，这是不是这个国家想要的结局。</p>\n<p>他只知道，这个国家，在用自己的方式，把每一个试图骑到它脖子上去的人，一个一个地，按回它制定的规矩里去。</p>\n<p>这或许，就是立宪最大的意义。</p>\n<p>夜里，容闳收到一封袁世凯送来的请帖，请他明日赴宴。</p>\n<p>他看着那封请帖，看了很久，终于把它放进了抽屉里。</p>\n<p>&quot;不去。&quot;他对送信的仆人说，&quot;告诉袁大人，容某年老，不胜酒力。改日，再登门拜谢。&quot;</p>\n<p>他关上门，坐回灯下，重新铺开那卷他拟了一半的宪法草案。</p>\n<p>窗外的风，正吹着院里那棵老槐树，沙沙地响。</p>"}, {"title": "第14章：皇帝学会了借力", "html": "<p>光绪二十五年（公元1899年），宪政钦定，皇帝监国，天下诏颁行。</p>\n<p>这道诏书，在宫里宣读那日，光绪皇帝坐在龙椅上，听礼官念完最后一个字，忽然觉得，自己好像做了一场很长很长的梦。</p>\n<p>他想起自己四岁进宫，在这深宫里活了二十多年，一直活在一个人的阴影下——那个人，是他的姨母，是圣母皇太后，是他名义上的母亲，实际上的牢笼。她扶持他登基，也囚禁他亲政；她给他皇帝的名分，也夺走了他皇帝的实权。</p>\n<p>他曾经无数次想过，要挣脱这张网。</p>\n<p>可他没有力量。他没有亲信，没有兵权，没有钱，没有能替他说话的臣子。他在这深宫里，像一只被豢养的金丝雀，只能看着那张网，一天比一天收得更紧。</p>\n<p>直到黄海一役，大捷。</p>\n<p>直到容闳那封&quot;乞见圣颜&quot;的信，传到他的案头。</p>\n<p>直到李鸿章、张之洞、刘坤一、袁世凯，那些各怀私心的臣子，各自为了自己的算盘，共同推动了立宪。</p>\n<p>他从来没有忘记，容闳在万寿宴后，托人捎给他的那句话：&quot;皇上若要亲政，不妨借立宪之名。天下之势，可借力而为，不必力抗。&quot;</p>\n<p>他当时不懂。如今，他懂了。</p>\n<p>立宪，是一场权力的重新分配。皇帝以宪法为纲，则皇权合法地收归君主；太后以宪法退居，则摄政名分自然消亡；督抚各守其职，则地方不再尾大不掉。他借着这场&quot;变法&quot;，不动声色地，把那些曾经压在他头顶的东西，一个一个地，搬开了。</p>\n<p>宪政颁布当日，光绪皇帝第一次，在养心殿单独召见容闳。</p>\n<p>&quot;容卿，&quot;皇帝开口，声音有些沙哑，&quot;朕听说，宪法第一条，是你写的。&quot;</p>\n<p>&quot;是。&quot;容闳叩首。</p>\n<p>&quot;朕还听说，&quot;皇帝接着说，&quot;三年前，你有个族侄，叫容星桥，因一封妄议朝政的私信，被刚毅下过狱。&quot;</p>\n<p>容闳的手，在膝上微微一颤。</p>\n<p>&quot;他如今，做什么？&quot;</p>\n<p>&quot;回皇上，&quot;容闳说，&quot;星桥革职之后，无官无职，如今在储材馆，替臣整理各国宪法条文，充作译员。&quot;</p>\n<p>&quot;译员？&quot;皇帝沉默了一会儿，忽然说，&quot;容卿，朕当年批那四个字——&#x27;从宽发落&#x27;——不是朕开恩，是朕那时，还没有能力替他说一句公道话。&quot;</p>\n<p>&quot;皇上……&quot;</p>\n<p>&quot;今日，朕有了。&quot;皇帝说，&quot;朕今日，追复容星桥原官，仍留海军衙门行走。这一笔，记在宪政的头一笔账上。&quot;</p>\n<p>容闳怔住了。他跪在原地，半晌没有动。</p>\n<p>他想起三年前那个阴天，想起族侄站在牢门外说的那句话：&quot;叔叔，那封信，我到底还是没招。&quot;</p>\n<p>他深深叩首，声音发颤：&quot;臣，替星桥，谢皇上。&quot;</p>\n<p>皇帝没有说话。他看着容闳伏在地上的身影，过了很久，才说：&quot;容卿，你起来。朕要你记住——今日这一笔，不是朕替你族侄翻案，是朕替&#x27;宪法&#x27;，立一个规矩：从今往后，这个国家，不许再有无名之狱。&quot;</p>\n<p>&quot;&#x27;以保民为先，民权所在，即国家命脉所系。&#x27;&quot;皇帝轻轻念着这句话，抬眼看着他，&quot;容卿，你这句话，写得好。可朕想知道，你是替谁写的？&quot;</p>\n<p>容闳沉默了一会儿，说：&quot;回皇上，臣是替这个国家的百姓写的。&quot;</p>\n<p>皇帝看着他，忽然笑了。那笑容里，有一丝说不清道不明的意味：&quot;容卿，你替百姓写，却不知，朕的百姓，认不认得这几个字。&quot;</p>\n<p>容闳抬起头，看着这位年轻的皇帝。他第一次如此近距离地打量他——瘦削的脸，清亮的眼睛，眉宇间却透着一股与年龄不符的沉郁。</p>\n<p>&quot;皇上，&quot;容闳说，&quot;百姓或许不认得字，但百姓认得，谁让他们过上好日子。&quot;</p>\n<p>皇帝沉默了一会儿，缓缓说：&quot;容卿，朕问你一句话。你说，朕这个皇帝，如今，算是&#x27;有权&#x27;了么？&quot;</p>\n<p>容闳想了想，说：&quot;皇上已据宪法而亲政，权在法上，法在皇上手中。&quot;</p>\n<p>&quot;那朕问你，&quot;皇帝盯着他，&quot;朕这个权，是朕自己的，还是他们给的？&quot;</p>\n<p>&quot;他们给的。&quot;容闳说，&quot;宪政，是李中堂、张制台、刘制台、袁统领，各自为了自己的私心，共同推动的。皇上的权，是从他们的私心里，借来的。&quot;</p>\n<p>皇帝没有发怒。他看着容闳，过了很久，才缓缓说：</p>\n<p>&quot;容卿，你说的不错。朕这个权，是他们给的。可朕要你记住——朕既然借了他们的权，就一定会把它，变成朕自己的。&quot;</p>\n<p>&quot;皇上圣明。&quot;</p>\n<p>&quot;朕不圣明。&quot;皇帝忽然苦笑了一下，&quot;朕只是，在这深宫里，学会了一个道理：这世上，没有白来的东西。要拿到什么，就得先学会，怎么用它。&quot;</p>\n<p>他站起身，走到窗前，看着外面的宫墙。</p>\n<p>&quot;容卿，&quot;他说，&quot;你替朕写的那条宪法，朕很喜欢。可朕今日召你来，是想告诉你另一件事。&quot;</p>\n<p>&quot;皇上请讲。&quot;</p>\n<p>&quot;朕要用你。&quot;皇帝转过身，看着他，&quot;朕要你，替朕办一件事。办成了，朕让你做这新政的功臣；办不成，你也算，尽过你的心了。&quot;</p>\n<p>&quot;皇上有何差遣？&quot;</p>\n<p>皇帝看着他，一字一句地说：&quot;朕要你，替朕把这新政，一条一条地，落到地方上去。不是落到督抚的书房里，是落到府、州、县，落到每一个收皇粮、纳国税的百姓的头上。朕要知道，这条宪法，到底能不能，撑起这个国家。&quot;</p>\n<p>容闳心里一热。他深深叩首：&quot;臣，领旨。&quot;</p>\n<p>他退出养心殿时，夕阳正好照在殿前的台阶上，把他的影子拉得很长。</p>\n<p>他忽然想起当年在船上，那些问过他很多问题的孩子。如今，他们中有人修成了铁路，有人办成了交涉，有人随舰队沉进了海——而他自己，也已经老了。</p>\n<p>&quot;容卿。&quot;一个声音忽然在身后响起。</p>\n<p>容闳回头，看见皇帝站在殿门口，逆着光，看不清表情。</p>\n<p>&quot;容卿，&quot;皇帝说，&quot;朕还有一个问题。&quot;</p>\n<p>&quot;皇上请讲。&quot;</p>\n<p>&quot;你说，那些替朕推了立宪的人——李鸿章、张之洞、刘坤一、袁世凯——他们如今，是朕的功臣，还是朕的债主？&quot;</p>\n<p>容闳想了想，说：&quot;回皇上，他们既是功臣，也是债主。&quot;</p>\n<p>&quot;为何？&quot;</p>\n<p>&quot;因为他们推了立宪，让皇上得了权，此是功臣；可他们各自，也从皇上这里，得了他们想要的——淮系的护身符，湖广的名分，两江的安泰，新军的地位。此是债主。&quot;</p>\n<p>皇帝沉默了一会儿，说：&quot;那朕，该怎么对他们？&quot;</p>\n<p>&quot;还他们该还的。&quot;容闳说，&quot;却不欠他们不该欠的。&quot;</p>\n<p>皇帝看着他，忽然笑了。那笑容里，有几分释然，也有几分，说不出的苍凉。</p>\n<p>&quot;容卿，&quot;他说，&quot;你下去吧。朕要一个人，坐一会儿。&quot;</p>\n<p>容闳叩首退出。他走下台阶，走出宫门，忽然回头看了一眼那座巍峨的养心殿。</p>\n<p>夕阳下，那殿门，正缓缓关上。</p>"}, {"title": "第15章：五人各自的结局", "html": "<p>光绪三十一年（公元1905年）秋。宪政实行已经六年，新政的果实，正一点一点地落在这片古老的土地上——卢汉铁路全线贯通，关内外铁路连接辽东，电报线、自来水、机器织布，从通商口岸，一路铺向内陆的县城。京师的学堂里，孩子们念的不再只是四书五经，也开始念格致、算学、地理。</p>\n<p>而当年那些推动这场变革的人，正在此后数年间，一个一个地，走向他们的结局。</p>\n<p>第一个离开的，是李鸿章。</p>\n<p>这位八十二岁的老人，在天津的寓所里，一病不起。容闳去看他时，他已经瘦得只剩一把骨头，却还撑着坐起来，把那份刚送来的《宪政年报》看了一遍。</p>\n<p>&quot;中堂，&quot;容闳坐在榻边，&quot;您该多歇息。&quot;</p>\n<p>&quot;歇息？&quot;李鸿章笑了笑，把那本《宪政年报》放在枕边，&quot;纯甫，你看着这册子，可还记得，三十年前，咱们在海上，一艘船都没有的日子？&quot;</p>\n<p>容闳没有说话。他当然记得。他记得那支曾经让日本人闻风丧胆、却因为没有新船、因为买不到炮弹而败落的舰队；记得李鸿章为海军争钱，争到连自家的棺材本都捐了出来。</p>\n<p>&quot;中堂，&quot;容闳说，&quot;您这一生，办了洋务，练了海军，推了立宪。这一册《宪政年报》上写的每一条新政，都有您的一份。&quot;</p>\n<p>李鸿章闭上眼睛，过了很久，才缓缓说：&quot;纯甫，你说这些，是给老夫听的。可老夫自己知道，老夫这一辈子，办的所谓洋务，所谓海军，所谓立宪，不过是一个&#x27;裱糊匠&#x27;，给一间破屋子，东补一块，西贴一块。老夫始终没能把它，拆了重盖。&quot;</p>\n<p>&quot;中堂……&quot;</p>\n<p>&quot;可如今，&quot;李鸿章睁开眼，看着窗外的天光，&quot;老夫这间破屋子，居然，自己长出了新的梁柱。这倒是老夫，万万没有想到的。&quot;</p>\n<p>他看着容闳，忽然笑了：&quot;纯甫，你说，这是不是天意？&quot;</p>\n<p>容闳想了想，说：&quot;中堂，这不是天意。是您那间破屋子，补得太多，贴得太厚，才终于，撑到了天亮。&quot;</p>\n<p>李鸿章怔了怔，随即大笑起来。那笑声又长又弱，像一阵被风吹散的潮声。</p>\n<p>三日后，李鸿章薨逝于天津。</p>\n<p>朝廷追赠太傅，谥文忠。送葬那日，天津的百姓，站满了十里长街。有人哭，有人沉默，有人议论着他这一生的功过。</p>\n<p>容闳没有去送葬。他站在海河边，看着那支送葬的队伍缓缓远去，耳边还响着那句&quot;破屋子长出了新梁柱&quot;。</p>\n<p>他终于明白了，李鸿章这一生，最大的成就，不是他办了多少洋务，不是他练了多少海军，而是他用自己的方式，替这间破屋子，撑开了一道缝——让阳光照了进来，让种子发了芽，让那些他一手培养起来的年轻人，终于有了落地生根的地方。</p>\n<p>他是裱糊匠。可这个国家，恰恰是因为有他这个裱糊匠，才没有在黎明前，彻底坍塌。</p>\n<p>第二个离开的，是刘坤一。</p>\n<p>光绪三十二年（公元1906年），这位两江总督病逝于任上，谥忠诚。他临终前，把两江的军政、财政，一件一件，交割得清清楚楚。他死后，东南半壁，没有乱。</p>\n<p>容闳听到这个消息时，正在湖北的卢汉铁路沿线巡查。他站在新建成的火车站台上，看着那些南来北往的旅客，忽然想起刘坤一当年在立宪会议上的那句话：&quot;两江之地，自练其兵，自理财赋，朝廷不得横加干预。&quot;</p>\n<p>他死时，两江果然还是他的两江。东南半壁的安定，是他刘坤一用半辈子经营出来的。</p>\n<p>他或许自私，或许守旧，或许从不肯为朝廷多出一分力——可他守住了东南，也就守住了这个国家最富庶的一块底盘。那几年，全国新政的银子，有一半，是从两江的税收里出来的。</p>\n<p>容闳只觉得，这些人，他们各自为了自己的地盘、自己的利益而争，却在不经意间，替这个国家，守住了它最需要的东西。</p>\n<p>第三个离开的，是张之洞。</p>\n<p>光绪三十四年（公元1908年），这位湖广总督在武昌病逝，谥文襄。他临终时，遗折里只写了一件事：请朝廷，继续兴办学堂，创办实业。</p>\n<p>他死时，湖广的汉阳铁厂、湖北织布局、两湖书院，已经成了全国新政的样板。那些学堂里的学生，那些工厂里的工人，都记得这个总督的名字。</p>\n<p>容闳去参加他的葬礼时，看着那些自发前来送葬的学生、工匠、百姓，忽然想起了张之洞当年在立宪会议上，那句&quot;楚地已有根基，当由楚地先行试办&quot;的话。</p>\n<p>他这一生，争的是名，争的是&quot;开中国实业学堂之先河&quot;的千秋清名。可他争来的名，是真的——那些学堂、那些工厂，真的替这个国家，培养出了一代又一代的人才。</p>\n<p>他或许清高，或许执着，或许容不得别人比他强。可他确确实实地，用他一辈子的执念，替这个国家，立起了一块块基石。</p>\n<p>第四个离开的，是慈禧太后。</p>\n<p>光绪三十五年（公元1909年），这位统治了大清半个世纪的女人，在颐和园薨逝，谥孝钦显皇后。</p>\n<p>容闳是在报纸上看到这个消息的。他想起光绪二十三年（公元1897年）那个春日，想起太后在答应立宪时说的那句话：&quot;哀家不要别的，只求哀家死后，能以一个体面的太后之礼，葬入皇陵。&quot;</p>\n<p>她死后，朝廷依礼厚葬，皇族体面，分毫不失。</p>\n<p>容闳看着报纸上那个&quot;薨&quot;字，想：这位太后，用一生的权欲，换来了皇族的存续。她当年答应立宪，不是因为她开明，是因为她算清了——保住一个&quot;虚君&quot;，好过失去整个江山。</p>\n<p>她的算盘，算得极准。她死后，清室还在，皇族还在，江山，也还在。</p>\n<p>第五个，是袁世凯。</p>\n<p>袁世凯没有被处死，没有被流放。他被架空后，一直做着陆军部会办、军机大臣之类的闲差，领着朝廷的俸禄，住着北京的宅子，养着几房姬妾，过着优渥的日子。</p>\n<p>容闳最后一次见他，是在光绪三十四年（公元1908年）的一次朝会上。袁世凯穿着崭新的朝服，站在班列里，精神矍铄，容光焕发。见到容闳，他拱了拱手，笑道：&quot;容大人，多年不见，您老还是这么硬朗。&quot;</p>\n<p>&quot;袁大人，&quot;容闳说，&quot;您也还是这么，精神。&quot;</p>\n<p>袁世凯笑道：&quot;托朝廷的福。如今新政大行，国家兴旺，袁某虽无大用，却也乐得做个太平官。&quot;</p>\n<p>他说&quot;太平官&quot;三个字时，眼底有一丝极淡的、一闪而过的光。</p>\n<p>容闳没有接话。他想起十多年前，万寿宴的偏殿里，那个向他敬酒、眼里藏着一架弓的年轻人。</p>\n<p>如今，那架弓，已经收了。这个年轻人，也老了。</p>\n<p>他只觉得，这世上的野心，或许最终，都会被时间，磨成一枚太平官的顶戴。</p>\n<p>光绪皇帝没有死。</p>\n<p>他活了下来，坐稳了皇位。他借着立宪，收回了实权；他借着新政，坐稳了江山。他不再是一个被囚禁在深宫里的傀儡，而是一个真正掌握了这个国家的君主。</p>\n<p>容闳最后一次见他，是在一次宪政庆典上。皇帝穿着崭新的礼服，站在太和殿前，接受百官朝贺。他看见了容闳，远远地，朝他微微点了一下头。</p>\n<p>容闳没有跪拜。他只是深深鞠了一躬，然后转身，走向宫门外。</p>\n<p>他想起，从黄海大捷到宪政实行的这十几年，这个国家，走过了一条多么不可思议的路。</p>\n<p>而他自己，从一个送幼童出洋的老书生，变成了宪政的起草者，变成了新政的见证者。</p>\n<p>他老了。</p>\n<p>可他看着这个国家，看着那些正在运行的铁路、电报、学堂、工厂，看着那些正在茁壮成长的孩子，觉得他这一生，没有白活。</p>\n<p>&quot;没有人想过救这个国家，&quot;他在心里，对自己说，&quot;可每个人都救了自己的利益。&quot;</p>\n<p>他望着窗外渐亮的天色，忽然想：也许，救这个国家的，从来就不是什么宏大的道理。</p>"}, {"title": "第16章：名册翻到最后", "html": "<p>光绪三十六年（公元1910年），容闳八十二岁。</p>\n<p>他住在天津一条安静的巷子里，院子不大，种着一株他亲手栽下的槐树。这些年，他老了，腿脚不便，很少出门。可他的屋子里，始终挂着两样东西：一幅世界地图，和那本翻旧了的名册。</p>\n<p>名册的扉页上，他早年写着一行小字：&quot;同治十一年，第一幼童出洋，共三十人。&quot;</p>\n<p>他常坐在窗前，看着那行字，一坐就是半天。</p>\n<p>这年春天，唐绍仪来看他。</p>\n<p>&quot;先生，&quot;唐绍仪如今已是总理衙门的大臣，穿着崭新的官服，精神矍铄，可在他面前，仍像个孩子，&quot;朝廷要开宪政议院了，您是宪政的起草人，晚辈想请您，去坐一坐。&quot;</p>\n<p>容闳摇摇头：&quot;绍仪，我老了，走不动了。议院，是你们年轻人的事了。&quot;</p>\n<p>唐绍仪没有强求。他坐下来，陪容闳说了一会儿话，说起这些年的新政，说起卢汉铁路，说起新建的学堂，说起那些越来越好的日子。</p>\n<p>&quot;先生，&quot;临走时，唐绍仪忽然问，&quot;您还记得，当年送我们出洋那天，您对我们说的话吗？&quot;</p>\n<p>容闳怔了怔。他记得。他记得那一年，他在上海送第一批幼童登船，看着那些十二三岁的孩子站在船舷边，他说的那句话：</p>\n<p>&quot;孩子们，你们这一去，是替这个国家，去看一看，外面的世界有多大。&quot;</p>\n<p>&quot;记得。&quot;他说。</p>\n<p>&quot;先生，&quot;唐绍仪说，&quot;我们这一辈子，就是替这个国家，把您当年说的那句话，一点一点地，带回来了。&quot;</p>\n<p>容闳没有说话。他看着唐绍仪的背影消失在巷口，眼睛有些发热。</p>\n<p>这年夏天，詹天佑来看他。</p>\n<p>&quot;先生，&quot;詹天佑说，&quot;京张铁路，通车了。&quot;</p>\n<p>容闳早就听说了。那条铁路，是詹天佑一手主持修成的，穿越崇山峻岭，被誉为中国第一条自行设计、自行施工的铁路。通车那日，朝廷派了大臣，沿途百姓站满了山坡。</p>\n<p>&quot;好。&quot;容闳说，&quot;好。&quot;</p>\n<p>詹天佑看着他，忽然说：&quot;先生，当年您说，中国够大，大到该装得下我们自己。如今，我信了。&quot;</p>\n<p>容闳看着他，笑了。他想起，当年在唐山，那个蹲在路基边、用洋铁尺量钢轨接缝的年轻人。如今，他已经是名满天下的工程师了。</p>\n<p>&quot;达礼，&quot;容闳唤着他的字，&quot;你修的这条铁路，替这个国家，开了一道门。&quot;</p>\n<p>&quot;先生，&quot;詹天佑说，&quot;是您，先替我们，开了那道门。&quot;</p>\n<p>容闳没有说话。他望着窗外，望着那株槐树，望着槐树下洒满的斑驳光影。</p>\n<p>这年秋天，陈金揆来看他。</p>\n<p>陈金揆已经不再是一条绷带吊着胳膊的伤兵了。他如今是重建后的北洋海军的管带，驾着崭新的军舰，在海上巡弋。他来看容闳时，穿着崭新的海军制服，腰板挺直，眉宇间那股沉郁之气，已经褪去了大半。</p>\n<p>&quot;先生，&quot;陈金揆说，&quot;我新造了一艘船，叫&#x27;致远&#x27;。&quot;</p>\n<p>容闳心里一颤。</p>\n<p>&quot;不是原来那艘致远。&quot;陈金揆说，&quot;是新的。先生，我把它造出来了。&quot;</p>\n<p>容闳看着他，想起十五年前，威海卫的海风里，那个说&quot;先生，致远没了&quot;的年轻人。</p>\n<p>&quot;金揆，&quot;容闳说，&quot;那艘船，还会沉吗？&quot;</p>\n<p>&quot;先生，&quot;陈金揆说，&quot;只要我还站在船上，它就不会沉。&quot;</p>\n<p>容闳看着他，忽然笑了。他笑着笑着，眼角沁出了一点泪光。</p>\n<p>这年秋末，萨镇冰也来看他。</p>\n<p>萨镇冰是坐着一艘小火轮来的。他如今统领重建的海军，穿着一身簇新的提督制服——这位当年的福建船政学堂学子，随船政留学潮赴英，学成归来大半生漂泊海上，此刻却比容闳记忆里任何一回见他，都要精神。他是来告诉容闳，重建的海军终于重新成军了，那些年轻的军官，是从新式海校毕业的，船政系的底子，留美幼童的学识，掺在一处，一个个，英气勃勃。</p>\n<p>&quot;先生，&quot;萨镇冰说，&quot;您当年替海军争的银子，如今，都变成船了。&quot;</p>\n<p>容闳没有说话。他看着窗外，看着那天边最后一线晚霞，忽然觉得，自己这一辈子，做过的最重要的一件事，可能不是起草宪政，不是送幼童出洋，而是——在这个国家最黑暗的时候，替它，点了一盏灯。</p>\n<p>他没有告诉萨镇冰这些。他只是说：&quot;好。好。&quot;</p>\n<p>送走萨镇冰，天已擦黑。容闳正要关门，巷口又走进来一个人。</p>\n<p>&quot;叔叔。&quot;</p>\n<p>容闳愣住了。他站在门口，看着来人——容星桥，一身海军的旧军装已经洗得发白，肩章上却仍是当年的纹样。皇帝追复他的原官之后，他一直在海军衙门供职，却再没有回海上。他如今年近五旬，两鬓已有了白发，可眼睛，还是当年那副&quot;自己拿主意&quot;的倔样。</p>\n<p>&quot;星桥，&quot;容闳看着他，&quot;你……怎么来了？&quot;</p>\n<p>&quot;我在海军衙门听说了。&quot;容星桥走进来，在槐树下站定，&quot;听说明年议院要开了，您却哪儿也不去。我想，您是不是累了。&quot;</p>\n<p>容闳没有回答。他看着这个族侄，想起十四年前那个四月，想起他站在牢门口说&quot;没事&quot;的样子，想起他挨了刑，在供词上翻来覆去只有一句话&quot;是学生自己写的，没有人指使&quot;。</p>\n<p>&quot;星桥，&quot;容闳说，&quot;你恨不恨这个国家？&quot;</p>\n<p>容星桥想了想，说：&quot;不恨。&quot;</p>\n<p>&quot;为什么？&quot;</p>\n<p>&quot;叔叔，&quot;容星桥说，&quot;我在牢里那几个月，想明白了一件事。这个国家，它那时候是笨的，是蠢的，是被人攥在手里当算盘珠子拨的。可它不坏。它只是，还没有学会自己走路。&quot;</p>\n<p>他顿了顿，又说：&quot;就像咱们幼童刚出洋那几年，连英语都说不利索，走在大街上，被人笑话。可后来，不是都学会了么。&quot;</p>\n<p>容闳看着他，忽然笑了。他笑着笑着，眼泪就下来了。</p>\n<p>&quot;星桥，&quot;他说，&quot;你比叔叔，想得开。&quot;</p>\n<p>&quot;不是想得开。&quot;容星桥说，&quot;是叔叔您教我的——自己拿主意。叔叔替这个国家拿了一辈子主意，如今，该轮到我们这些人，替它拿主意了。&quot;</p>\n<p>夜风穿过槐树的枝叶，沙沙地响。</p>\n<p>容星桥没有多留。他走了几步，又回过头来，说：&quot;叔叔，明年议院开幕，我会去的。我替咱们幼童，坐一席。&quot;</p>\n<p>&quot;好。&quot;容闳说，&quot;你去。替叔叔，也坐一席。&quot;</p>\n<p>他站在门口，看着族侄的背影消失在夜色里。</p>\n<p>那一夜，容闳坐在灯下，把那本名册，一页一页地翻到最后。</p>\n<p>名册的最后一页，他早年抄着一段话，是他从《史记》里抄的：&quot;前事不忘，后事之师。&quot;</p>\n<p>他看了那行字很久，忽然拿起笔，在下面，添了一行字。</p>\n<p>&quot;吾终生所求者，非富国强兵，非王霸之道，乃&#x27;民权&#x27;二字。然今日方知，民权二字，太重了。重到，要用整整一代人的心血，才担得起。&quot;</p>\n<p>他放下笔，看着窗外。夜色浓重，远处，隐约有火车汽笛的声音传来。</p>\n<p>他想起，这十几年，从黄海大捷，到宪政实行，到铁路贯通，到海军重建——这个国家，竟像一株从石头缝里长出来的树，一点一点，站直了腰。</p>\n<p>他没有想明白，这到底是谁的功劳。</p>\n<p>是李鸿章？是他那东补一块西贴一块的&quot;裱糊&quot;，撑住了这间屋子。</p>\n<p>是张之洞？是他那一座座学堂、一座座工厂，替这屋子立起了新的骨架。</p>\n<p>是刘坤一？是他守住的那东南半壁，给了这屋子，一块安定的地基。</p>\n<p>是袁世凯？是他那支新军，让这屋子有了可以倚仗的梁柱。</p>\n<p>是慈禧？是她那最后的&quot;让步&quot;，让这屋子，没有被从内部拆毁。</p>\n<p>是光绪？是他学会了&quot;借力&quot;与&quot;收权&quot;，让这屋子，终于有了一个当家的主人。</p>\n<p>都不是。又都是。</p>\n<p>容闳忽然明白了一件事：这个国家的救赎，从来不是某一个人的功劳，而是这一群人，各自为了自己的私心，在这间屋子里，你推一把，我撑一把，他补一块，最后，竟把这间摇摇欲坠的破屋子，硬生生地，撑到了天亮。</p>\n<p>&quot;没有人想过救这个国家，&quot;他在心里，轻轻地，对自己说，&quot;可每个人都救了自己的利益。然后这个国家，居然，活了。&quot;</p>\n<p>他起身，走到窗前，推开窗。</p>\n<p>深冬的夜风灌进来，带着泥土和草木的气息。远处，铁轨上的火车，正拉着汽笛，哐当哐当地驶向远方。</p>\n<p>他忽然想起当年在船上，那个最后一个走下舷梯、又回头看了他一眼的孩子。</p>\n<p>如今，他终于可以回答了。</p>\n<p>&quot;美国很大，大到装得下很多东西。&quot;他望着夜色深处，轻轻地说，&quot;可中国，也够大了。大到——终于装下了我们自己。&quot;</p>\n<p>风从窗外吹进来，吹动桌上那本名册的纸页。</p>\n<p>纸页哗哗地翻动，像一片片，正在飞起来的，旧翅膀。</p>"}, {"title": "尾声：一个没坐上龙椅的孩子", "html": "<p>光绪四十二年（公元1916年），天津，南开学校。</p>\n<p>新式的学堂里，下课钟刚敲过。一个十一岁的少年抱着几册算术课本，从教室里出来，被一个年纪相仿的同学拦住。</p>\n<p>&quot;溥仪，&quot;那同学压低声音，&quot;你听说了吗？宗人府那边传话，说是……明年要议定新皇储了。&quot;</p>\n<p>少年站住了。他叫爱新觉罗·溥仪，是醇亲王的孙子，宣宗皇帝的后裔——在族谱上，他本是一个随时可能被推上那个位置的孩子。他从小听府里的老太监说过无数遍：他出生那年，宫里便有人掐着指头算他的生辰八字，算他&quot;是否当得起龙椅的命数&quot;。</p>\n<p>那都是很久以前的事了。那时的宫墙还是墙，那时的年号还轮不到他。后来一切都变了——太后退居，宪政颁行，皇帝亲政。宫墙还在，可那墙里的规矩，已经换成了法律。皇位有了宪法规定的承继次序，再不是太后一句话、一道懿旨能定的事。</p>\n<p>&quot;议定新皇储？&quot;溥仪愣了愣，把算术课本在怀里掂了掂，&quot;那是宗人府的事吧。跟我有什么相干？&quot;</p>\n<p>&quot;怎么不相干？&quot;同学急了，&quot;论血缘，你排得可靠前了。万一……&quot;</p>\n<p>&quot;没有万一。&quot;溥仪打断他，老气横秋地摆了摆手，可那摆手的样子，到底还是个孩子学大人，&quot;皇上好好地当着皇帝呢。再说了，&quot;他拍了拍怀里的课本，&quot;我阿玛说了，我只要好好读书就行。宗人府的事，我阿玛管，我才不管。&quot;</p>\n<p>同学怔了怔，似懂非懂地走了。</p>\n<p>溥仪一个人站在操场上。风吹过他单薄的衣襟，他低头看了看怀里的课本——算术、格致、英文。他想起去年，他随学堂到唐山参观京张铁路，看见詹天佑先生站在隧道的图纸前，用一支铅笔画出一条跨越崇山的线。他忽然觉得，那支铅笔，比龙椅上的任何一根权杖，都更有分量。</p>\n<p>他不知道自己将来会做什么。他只知道，他这一生，不会再被锁进那座宫墙里，当作一件可以随时被摆上祭坛的器物。</p>\n<p>——在另一条走岔了的历史里，他会三岁登基，六岁退位，被圈在紫禁城的一角，当几十年傀儡，被各色各样的人捏在手里，当作旗号、筹码、玩物，直到那个曾经属于他的天下，彻底不再记得他。</p>\n<p>而在这条历史里，光绪皇帝活到了宪政的第三十六年（公元1934年），皇位依宪传承，宗室子弟各有生业。</p>\n<p>溥仪，只是千千万万普通皇族中的一个。</p>\n<p>他正要转身走回教室，忽然看见操场边站着一个老人。那老人穿着洗得发白的旧袍子，佝偻着背，正眯着眼睛看他。</p>\n<p>&quot;这位老先生，&quot;溥仪走过去，规规矩矩地行了个学礼，&quot;您是谁呀？&quot;</p>\n<p>&quot;我姓容。&quot;老人说，&quot;容闳。&quot;</p>\n<p>溥仪眼睛一亮。他读过这位老爷爷的事——第一批留洋小孩的送行人，朝廷立宪时候起草条文的人。老师上课时讲到过他的名字，说他是&quot;开眼看世界的人&quot;。他没想到会在这里遇见他。</p>\n<p>&quot;容……容爷爷，&quot;溥仪仰着头，&quot;您怎么在这儿？&quot;</p>\n<p>&quot;我到南开来，看看学堂。&quot;容闳说，&quot;看完了，正要回去。路过操场，瞧见你在这儿说话。&quot;</p>\n<p>他顿了顿，忽然问：&quot;小公子，你方才说，你要&#x27;做点实打实的学问&#x27;。你打算做什么？&quot;</p>\n<p>溥仪想了想，认认真真地说：&quot;我还没想好。可我不想当皇帝。我想造火车，像詹天佑先生那样。我去年在唐山看过他画的那个山洞，特别神。&quot;</p>\n<p>容闳看着他，忽然笑了。那笑容里有几分欣慰，也有几分，说不出的苍凉。</p>\n<p>&quot;好，&quot;他说，&quot;不想当皇帝，好。造火车，也好。&quot;</p>\n<p>他转身，慢慢朝校门走去。走了几步，又停下来，没有回头，只说了一句：</p>\n<p>&quot;孩子，我这一辈子，送出去一百二十个孩子，让他们去看世界。如今，我终于看见——这个国家，终于学会，自己往前走了。&quot;</p>\n<p>他走了。风把他那身旧袍子吹得猎猎作响。</p>\n<p>溥仪站在原地，看着那老人渐行渐远的背影，忽然觉得，自己手里的算术课本，沉甸甸的，像托着什么东西。</p>\n<p>他低头看了看课本，又抬起头，望向操场外那一片辽阔的天空。</p>\n<p>那一年，是光绪四十二年（公元1916年）。</p>\n<p>距离黄海之战的那一天，已经过去了整整二十二年。</p>\n<p>在那条被拨转的历史里，没有人想过救这个国家。</p>\n<p>可每个人都救了自己的利益。</p>\n<p>然后这个国家，居然，活了。</p>\n<p>并且活得——足够让一个本该成为傀儡的孩子，安安静静地，站在这所新式学堂的操场上，认认真真地盘算着，自己长大了要修一条什么样的铁路。</p>\n<p>全文完</p>"}];

function render() {
  const ch = CHAPTERS[idx];
  article.innerHTML = '<h2>' + ch.title + '</h2>' + ch.html;
  progress.textContent = (idx + 1) + ' / ' + CHAPTERS.length;
  document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('active', +a.dataset.i === idx));
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === CHAPTERS.length - 1;
  document.title = ch.title + ' · 黄海1894';
  article.scrollTop = 0;
}

function buildToc() {
  const toc = document.getElementById('toc');
  CHAPTERS.forEach((ch, i) => {
    const a = document.createElement('a');
    a.dataset.i = i;
    a.textContent = ch.title;
    a.addEventListener('click', () => { idx = i; render(); save(); closeMobileToc(); });
    toc.appendChild(a);
  });
}

function save() {
  localStorage.setItem(posKey, idx);
  localStorage.setItem(fontSizeKey, getComputedStyle(article).fontSize);
}
function closeMobileToc(){ document.getElementById('sidebar').classList.remove('open'); }

document.getElementById('btnPrev').onclick = () => { if (idx>0) { idx--; render(); save(); } };
document.getElementById('btnNext').onclick = () => { if (idx<CHAPTERS.length-1) { idx++; render(); save(); } };
document.getElementById('btnToc').onclick = () => document.getElementById('sidebar').classList.toggle('open');

function setFont(d) {
  const cur = parseFloat(getComputedStyle(article).fontSize) || 18;
  const next = Math.min(28, Math.max(13, cur + d));
  article.style.fontSize = next + 'px';
  save();
}
document.getElementById('btnFontUp').onclick = () => setFont(1);
document.getElementById('btnFontDown').onclick = () => setFont(-1);

const btnTheme = document.getElementById('btnTheme');
function applyTheme(dark){ document.body.classList.toggle('dark', dark); btnTheme.textContent = dark ? '☀ 明亮' : '🌓 明暗'; }
btnTheme.onclick = () => { const dark = !document.body.classList.contains('dark'); applyTheme(dark); localStorage.setItem(themeKey, dark ? '1':'0'); };

(function init(){
  buildToc();
  const savedTheme = localStorage.getItem(themeKey) === '1';
  applyTheme(savedTheme);
  const savedFont = localStorage.getItem(fontSizeKey);
  if (savedFont) article.style.fontSize = savedFont;
  const savedPos = parseInt(localStorage.getItem(posKey));
  if (!isNaN(savedPos) && savedPos >= 0 && savedPos < CHAPTERS.length) idx = savedPos;
  render();
})();
</script>
</body>
</html>
